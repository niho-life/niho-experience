<!doctype html>
<!--
  mock: NIHO Experience（experience.niho.life）のロゴ案 13 方向。集う系 A〜F（卓を囲む / 飛び石 / 開いた戸口 / 器 / はんこ / i の点）、旅・出かける系 G〜M（足あと / 荷札 / 行き先ピン / 切符 / 旅路 / リュック / のれん）、追加 N〜S（右へ歩く足 ×2・リュック ×2・切符 ×2。N/O/P/S は NIHO kamakura と同じく小石が集まって形を成す）
  論点: 体験予約サイトの顔として、NIHO 家族（小石）との血縁をどこまで見せるか。サイトの Fraunces セリフ・手描き線・はんこと同居できるか。
        ヘッダー 20px の並び・favicon 16px・写真上の白抜き・単色（印刷/スタンプ）で成立するか。
  作っていない: N/O/P/S の小石の敷き詰めは乱数（固定 seed）で置いていて、清書時に手で整える。各案は SVG の手置き（小石の形は apps/mobile/native/ios/NihoLaunchLogo.svg の原本をそのまま使用）。選定後に清書・書き出し。
        ヘッダーのナビは見た目だけで遷移しない。日本語 wordmark・/ja 面・OGP 画像・アニメーションは未検討。E の文字は Nunito の仮組み。
        上の「家族の列」の既存 4 つは PNG/JPG の現物。候補は A〜F の切替で差し替わる。
  参照: experience.niho.life ヘッダー（Fraunces「NIHO Experience」・Nunito ナビ・Caveat の強調）
        niho-experience packages/experience-presentation/src/v1（icons.tsx HandIcon / RubberStamp、styles.source.css の色・書体）
        apps/web/public/niho-kamakura-logo.png（アーチ #A2C3D1）・apps/web/public/niho-logo.png・docs/design/design-guide.md §1–3
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIHO Experience ロゴ案 v1</title>
<style>
@font-face{font-family:"Fraunces Variable";font-style:normal;font-weight:100 900;font-display:swap;src:url("assets/experience/fonts/fraunces-latin-wght-normal.woff2") format("woff2-variations")}
@font-face{font-family:"Nunito Variable";font-style:normal;font-weight:200 1000;font-display:swap;src:url("assets/experience/fonts/nunito-latin-wght-normal.woff2") format("woff2-variations")}
@font-face{font-family:"Caveat Variable";font-style:normal;font-weight:400 700;font-display:swap;src:url("assets/experience/fonts/caveat-latin-wght-normal.woff2") format("woff2-variations")}
:root{
  --canvas:#fff;--sand:#f5f5f2;--ink:#1c1c1a;--ink-soft:#4b4b47;--muted:#6c6c67;--line:#e8e8e4;--line-strong:#d4d4cf;
  --moss:#355e1f;--leaf:#b2d67c;--leaf-pale:#eef5e3;
  --radius:1.375rem;--shadow:0 1px 2px rgb(28 28 26/.04),0 10px 30px rgb(28 28 26/.08);
  --sans:"Nunito Variable","Hiragino Sans","Noto Sans JP",ui-sans-serif,system-ui,sans-serif;
  --display:"Fraunces Variable",Georgia,"Hiragino Mincho ProN",serif;
  --hand:"Caveat Variable","Bradley Hand",cursive;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit}
#measure{position:absolute;left:-9999px;top:0;visibility:hidden}
.defs{position:absolute;width:0;height:0;overflow:hidden}

.bar{position:sticky;top:0;z-index:20;background:rgb(255 255 255/.94);backdrop-filter:blur(10px) saturate(1.2);border-bottom:1px solid var(--line)}
.bar-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.bar-title{font-family:var(--display);font-size:1.0625rem;font-weight:600;letter-spacing:-.01em;margin-right:auto}
.bar-title span{font-family:var(--sans);font-weight:800;font-size:.75rem;color:var(--muted);margin-left:.4em}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;color:var(--ink-soft);font-weight:800;font-size:.8125rem;padding:7px 13px;cursor:pointer;min-width:38px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:#fff}
.seg.pick button.on{background:var(--moss)}

.family{max-width:1120px;margin:22px auto 8px;padding:0 16px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 22px}
.fam{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:84px}
.fam img,.fam .plain{width:72px;height:72px;object-fit:contain;display:grid;place-items:center}
.fam span{font-size:.75rem;font-weight:700;color:var(--muted);white-space:nowrap}
.fam.cand span{color:var(--moss)}
.fam.cand span em{font-style:normal;font-family:var(--hand);font-size:1.25rem;line-height:1;margin-left:.25em}
.appicon{width:72px;height:72px;border-radius:22%;background:linear-gradient(180deg,#fdfcf9,#f0ece4);box-shadow:inset 0 0 0 1px rgb(28 28 26/.07),0 4px 10px rgb(28 28 26/.08);display:grid;place-items:center}

.case{max-width:1120px;margin:26px auto;padding:0 16px}
.case-h{display:flex;align-items:baseline;gap:12px;margin:0 4px 10px}
.case-h .tag{font-family:var(--hand);font-size:2.25rem;line-height:.9;font-weight:700;color:var(--moss)}
.case-h h2{margin:0;font-family:var(--display);font-size:1.375rem;font-weight:600;letter-spacing:-.01em}
.grid{display:grid;gap:12px;grid-template-columns:1fr;grid-template-areas:"big" "lock" "hdr" "hero" "small" "mono"}
@media (min-width:880px){
  .grid{grid-template-columns:300px 1fr 1fr;grid-template-areas:"big lock lock" "big hdr hero" "small small mono"}
}
.cell{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:18px;display:flex;align-items:center;justify-content:center;min-height:120px;overflow:hidden;transition:box-shadow .2s}
.cell.big{min-height:300px;grid-area:big}
.cell.lock{grid-area:lock;min-height:116px}
.cell.hdrc{grid-area:hdr;padding:0;flex-direction:column;align-items:stretch;justify-content:flex-start;background:var(--sand);container-type:inline-size}
.cell.hero{grid-area:hero;padding:0;align-items:stretch;container-type:inline-size}
.cell.small{grid-area:small;flex-wrap:wrap;gap:20px 28px;justify-content:flex-start}
.cell.mono{grid-area:mono;gap:12px;flex-wrap:wrap}
.case.on .cell.big{box-shadow:0 0 0 2px var(--leaf)}

.brand{display:inline-flex;align-items:center;line-height:0}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);min-width:0}
.hdr-in .brand-slot{flex:none;line-height:0}
.hdr-in nav{display:flex;align-items:center;gap:16px;font-size:.8125rem;font-weight:800;color:var(--ink);white-space:nowrap}
.hdr-in nav .lang{border:1px solid var(--line-strong);border-radius:999px;padding:4px 10px}
.hdr-in.on-photo{background:transparent;border:0}
.hdr-in.on-photo nav{color:#fff}
.hdr-in.on-photo nav .lang{border-color:rgb(255 255 255/.6)}
.page-ghost{padding:14px 16px 18px;display:grid;gap:8px}
.page-ghost i{display:block;height:9px;border-radius:999px;background:var(--line)}
.page-ghost i:nth-child(1){width:52%;height:14px;background:var(--line-strong)}
.page-ghost i:nth-child(2){width:78%}
.page-ghost i:nth-child(3){width:64%}
.hero-in{flex:1;min-width:0;width:100%;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:linear-gradient(180deg,rgb(0 0 0/.42),rgb(0 0 0/.12) 55%,rgb(0 0 0/.42)),url("assets/niho-dinner-1.jpg") center/cover}
.hero-h{margin:0;padding:0 16px 14px;font-family:var(--display);font-size:1.5rem;line-height:1.1;font-weight:600;letter-spacing:-.01em;max-width:14ch}
.hero-h em{font-style:normal;font-family:var(--hand);color:var(--leaf);font-size:1.25em;font-weight:600}
@container (max-width:560px){.hdr-in nav span:not(.lang){display:none}}
@media (max-width:420px){.hdr-in nav span:not(.lang){display:none}}

.tabbar{display:flex;align-items:flex-end;padding:8px 10px 0;background:var(--line);border-radius:12px 12px 0 0}
.tab{display:inline-flex;align-items:center;gap:9px;padding:8px 14px 8px 11px;border-radius:9px 9px 0 0;background:#fff;font-size:.8125rem;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.tab svg{flex:none}
.sizes{display:inline-flex;align-items:flex-end;gap:16px}
.chip{width:96px;height:96px;border-radius:18px;display:grid;place-items:center}
.chip.sand{background:var(--sand)}
.chip.moss{background:var(--moss)}
.chip.ink{background:var(--ink)}
.group{max-width:1120px;margin:34px auto -8px;padding:0 20px;font-size:.8125rem;font-weight:800;color:var(--muted);letter-spacing:.04em}
.foot{max-width:1120px;margin:30px auto 50px;padding:0 16px;font-size:.75rem;color:var(--muted)}
</style>
</head>

<section class="family" aria-label="family">

function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function markSVG(key, mode, size, wide = false) {

  return `<svg class="mark" viewBox="${box}" width="${w.toFixed(1)}" height="${size}" aria-hidden="true" focusable="false">${(useWide ? m.wide : m.render).call(m, mode, size)}</svg>`;

function wordmark({ size = 20, mode = 'color', hand = false, dot = false }) {
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('class', 'wm'); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', 'NIHO Experience');
