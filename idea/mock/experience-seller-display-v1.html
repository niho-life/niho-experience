<!doctype html>
<!--
  mock: 体験詳細ページの「団体相談の行」と「販売者の行」の整理、販売者表示の外部URL廃止 v1（2026-11-28）
  対象:
    - apps/web/src/components/pages/SitePublicationPage.tsx（#inquiry・#seller・ホストの欄）
    - apps/web/src/components/host/HostSellerDisclosureForm.tsx・app/(host)/host/(console)/seller/page.tsx
    - apps/web/src/components/host/HostRegisterForm.tsx（特商法表示 URL）、components/preparations/PreparationDraftFields.tsx（特商法等の表示URL）
  オーナーの決定（2026-11-28）:
    1. ページ下の「学校・会社・グループでの参加は、予約の前に相談できます。相談する」を消す。
       企業・学校はフッターの「企業・学校の方へ」「体験のご相談」で受ける。予約カードの「ほかの日・グループの相談」は残す。
    2. 「販売者：…・特定商取引法に基づく表記」の行をやめ、「特定商取引法に基づく表記」のリンクだけをホストの欄の末尾に置く（2026-11-28 追記）。
       施設名（ホスト名）は欄の冒頭に出ており、販売者の社名・住所・連絡先はリンク先の表記ページに載せる。ホストの欄が無い体験は、リンクだけをページ末尾に置く。
       予約入力の決済直前の販売者表示は変えない。
    3. 販売者表示の外部URL（自分の既存の特商法ページへ案内する方式）を廃止し、このサイトが体験ごとに作る /experiences/{slug}/seller だけにする。
  実装に含めない: ②の「公開中の表記を見る」リンク（販売者表示の画面に公開中の体験の一覧を読んでいないため。必要なら別途）。
  作っていない: スマホの細部の調整、英語ページ（同じ変更を About your host / Sold by … · Seller information に適用する）、既存の外部URLの移行手順。
  画面の体験ページ部分は travel.niho.life の本番HTML（2026-11-28取得）とCSSをそのまま使い、差分だけ書き換えた。ホストの紹介文は v2 モックの仮文。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mock: 販売者表示と相談の整理 v1</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#e9e6df;color:#1d1d1b}
  .bar{position:sticky;top:0;z-index:5;background:#1d1d1b;color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
  .bar h1{font-size:14px;margin:0 8px 0 0;font-weight:800}
  .group{display:flex;gap:4px;flex-wrap:wrap}
  .bar button{border:1px solid #555;background:transparent;color:#ddd;border-radius:999px;padding:5px 12px;font:700 12.5px system-ui,sans-serif;cursor:pointer}
  .bar button[aria-pressed=true]{background:#fff;color:#1d1d1b;border-color:#fff}
  .sub{display:flex;gap:10px;align-items:center}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font:700 11.5px system-ui}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border:2px dashed currentColor;border-radius:3px;margin-right:4px;vertical-align:-1px}
  .why{background:#fff;border-bottom:1px solid #d6d2c8;padding:12px 16px;font-size:13px;line-height:1.7}
  .why b{font-weight:800}
  .stage{display:flex;justify-content:center;padding:16px}
  iframe{background:#fff;border:0;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.15);width:100%;height:calc(100vh - 170px)}
  iframe.phone{width:390px;height:844px;max-height:calc(100vh - 170px)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="bar">
  <h1>販売者表示と相談の整理 v1</h1>
  <div class="group" role="group" aria-label="画面">
    <button data-tab="page" aria-pressed="true">① 体験ページ</button>
    <button data-tab="seller" aria-pressed="false">② ホスト：販売者表示</button>
    <button data-tab="register" aria-pressed="false">③ 登録・代行準備の入力欄</button>
  </div>
  <div class="sub" id="pageControls">
    <div class="group" role="group" aria-label="状態">
      <button data-variant="before" aria-pressed="true">現状（本番）</button>
      <button data-variant="afterHost" aria-pressed="false">修正後：ホストの欄あり</button>
      <button data-variant="afterNoHost" aria-pressed="false">修正後：ホストの欄なし</button>
    </div>
    <div class="group" role="group" aria-label="幅">
      <button data-width="pc" aria-pressed="true">PC</button>
      <button data-width="phone" aria-pressed="false">スマホ</button>
    </div>
  </div>
  <div class="legend"><span style="color:#fb923c">消す</span><span style="color:#a78bfa">移す</span><span style="color:#4ade80">新しい位置・文</span><span style="color:#38bdf8">残す</span></div>
</div>
<div class="why" id="why"></div>
<div class="stage"><iframe id="frame" title="モック"></iframe></div>

-card)]\"><div class=\"sticky top-0 z-10 flex items-start justify-between gap-4 border-b border-line bg-white px-5 py-4 sm:px-7\"><div><h2 id=\"experience-date-picker-title\" class=\"text-xl font-extrabold\">日にちと人数を選ぶ<\/h2><p class=\"mt-1 text-sm text-ink-soft\">大人1名 ¥30,000〜<\/p><\/div><button type=\"button\" autofocus=\"\" class=\"grid size-11 shrink-0 place-items-center rounded-full border border-line-strong text-2xl\" aria-label=\"閉じる\">×<\/button><\/div><div class=\"grid gap-5 p-5 sm:p-7\"><div role=\"group\" aria-label=\"開催日\"><p role=\"status\" class=\"rounded-xl border border-line-strong p-3 text-sm font-normal text-muted\">日時を読み込み中…<\/p><\/div><p class=\"text-sm text-ink-soft\">開催日を選ぶと、開始時刻と参加人数を選べます。<\/p><\/div><\/dialog><div class=\"fixed inset-x-0 bottom-0 z-30 flex items-center justify-between gap-3 border-t border-line bg-white px-4 py-3 lg:hidden\"><p class=\"min-w-0 text-[0.9375rem]\"><b class=\"text-[1.125rem]\">¥30,000<\/b><span class=\"text-[0.8125rem] text-ink-soft\">〜 / 人<!-- --> · 次回 12月5日(土)<\/span><\/p><button type=\"button\" class=\"inline-flex min-h-12 items-center justify-center gap-2 rounded-full px-6 text-base font-extrabold transition-colors disabled:cursor-not-allowed disabled:opacity-60 bg-leaf text-ink hover:bg-leaf-hover w-auto min-w-[132px] whitespace-nowrap\">日にちを選ぶ<\/button><\/div><\/aside><main class=\"min-w-0 lg:col-start-1 lg:row-start-2\"><section class=\"pt-6\" aria-label=\"概要\"><p class=\"text-lg leading-relaxed\">鎌倉駅から徒歩2分のNIHO kamakuraで、地域の住民と季節の家庭料理を作り、食卓を囲んで会話を楽しむ体験です。<\/p><ul class=\"mt-6 grid gap-3.5\"><li class=\"flex items-center gap-3.5\"><svg class=\"ico size-10\" viewBox=\"0 0 48 48\" aria-hidden=\"true\" focusable=\"false\"><defs><filter id=\"_S_2_\" x=\"-15%\" y=\"-15%\" width=\"130%\" height=\"130%\"><feTurbulence type=\"turbulence\" baseFrequency=\"0.045\" numOctaves=\"2\" seed=\"4\" result=\"t\"><\/feTurbulence><feDisplacementMap in=\"SourceGraphic\" in2=\"t\" scale=\"2.2\" xChannelSelector=\"R\" yChannelSel "flex gap-2\"><svg class=\"ico mt-0.5 size-5 shrink-0\" viewBox=\"0 0 48 48\" aria-hidden=\"true\" focusable=\"false\"><defs><filter id=\"_S_8_\" x=\"-15%\" y=\"-15%\" width=\"130%\" height=\"130%\"><feTurbulence type=\"turbulence\" baseFrequency=\"0.045\" numOctaves=\"2\" seed=\"4\" result=\"t\"><\/feTurbulence><feDisplacementMap in=\"SourceGraphic\" in2=\"t\" scale=\"2.2\" xChannelSelector=\"R\" yChannelSelector=\"G\"><\/feDisplacementMap><\/filter><\/defs><g filter=\"url(#_S_8_)\"><path d=\"M10.6 25.4c3 2.6 5.4 5.6 7.6 9.4 4.6-9.4 11.4-17.6 19.8-23.6\" stroke-width=\"2.4\"><\/path><\/g><\/svg>会話と文化交流<\/li><\/ul><\/div><div><h3 class=\"font-extrabold\">含まれないもの<\/h3><ul class=\"mt-3 space-y-2 text-ink-soft\"><li class=\"flex gap-2\"><svg class=\"ico mt-0.5 size-5 shrink-0\" viewBox=\"0 0 48 48\" aria-hidden=\"true\" focusable=\"false\"><defs><filter id=\"_S_9_\" x=\"-15%\" y=\"-15%\" width=\"130%\" height=\"130%\"><feTurbulence type=\"turbulence\" baseFrequency=\"0.045\" numOctaves=\"2\" seed=\"4\" result=\"t\"><\/feTurbulence><feDisplacementMap in=\"SourceGraphic\" in2=\"t\" scale=\"2.2\" xChannelSelector=\"R\" yChannelSelector=\"G\"><\/feDisplacementMap><\/filter><\/defs><g filter=\"url(#_S_9_)\"><path d=\"M14.4 14.6c6.8 6 12.8 12.6 19.2 19.6M33.4 14.2c-6.8 6.2-13 12.8-18.8 19.8\"><\/path><\/g><\/svg>会場までの往復交通費<\/li><li class=\"flex gap-2\"><svg class=\"ico mt-0.5 size-5 shrink-0\" viewBox=\"0 0 48 48\" aria-hidden=\"true\" focusable=\"false\"><defs><filter id=\"_S_a_\" x=\"-15%\" y=\"-15%\" width=\"130%\" height=\"130%\"><feTurbulence type=\"turbulence\" baseFrequency=\"0.045\" numOctaves=\"2\" seed=\"4\" result=\"t\"><\/feTurbulence><feDisplacementMap in=\"SourceGraphic\" in2=\"t\" scale=\"2.2\" xChannelSelector=\"R\" yChannelSelector=\"G\"><\/feDisplacementMap><\/filter><\/defs><g filter=\"url(#_S_a_)\"><path d=\"M14.4 14.6c6.8 6 12.8 12.6 19.2 19.6M33.4 14.2c-6.8 6.2-13 12.8-18.8 19.8\"><\/path><\/g><\/svg>追加の飲み物<\/li><\/ul><\/div><\/div><\/section><section id=\"place\" class=\"scroll-mt-24 border-b border-line py-8 lg:py-10\"><h2 class=\"text-2xl\">場所<\/h2><div class=\"mt-4 space-y-2 text-ink-soft\"><p>東京駅からJR横須賀線で約1時間（乗り換えなし）<\/p><p>正確な集合場所は、予約が確定したあとにお伝えします。<\/p><\/div><\/section><section id=\"know-before-you-go\" class=\"scroll-mt-24 border-b border-line py-8 lg:py-10\"><h2 class=\"text-2xl\">参加前にご確認ください<\/h2><div class=\"mt-4\"><h3 class=\"font-extrabold\">キャンセル<\/h3><ul class=\"mt-2 space-y-2 text-ink-soft\"><li>開始24時間前までキャンセル無料<\/li><\/ul><\/div><div class=\"mt-5\"><h3 class=\"font-extrabold\">参加に向かない条件<\/h3><ul class=\"mt-2 list-disc space-y-2 pl-5 text-ink-soft\"><li>食物アレルギーがある方：アレルギー対応はできません。<\/li><li>階段を利用できない方：会場は2階で、車いすでのアクセスはできません。<\/li><\/ul><\/div><div class=\"mt-5\"><h3 class=\"font-extrabold\">参加前の注意<\/h3><ul class=\"mt-2 list-disc space-y-2 pl-5 text-ink-soft\"><li>毎週土日18時〜20時（日本時間）。受付は開始48時間前までです。<\/li><li>カード決済の成立後、予約が即時に確定します。<\/li><li>0〜17歳の子どもは大人の同伴が必要です。<\/li><li>献立は食材の入荷状況により変わります。特定のホストや住民の参加は保証しません。<\/li><\/ul><details class=\"mt-3\"><summary class=\"min-h-11 cursor-pointer py-2 font-bold text-moss underline underline-offset-4\">すべての注意を見る<\/summary><ul class=\"list-disc space-y-2 pl-5 text-ink-soft\"><li>会場は2階で階段があります。喫煙はできません。<\/li><li>通常の雨天は屋内で開催します。荒天などで安全な開催が難しい場合は、日程変更または全額返金をご案内します。<\/li><li>交通機関が運休した場合は、開始前にご連絡ください。日程変更または全額返金をご相談できます。<\/li><li>お待ちできるのは15分までです。連絡のない15分超の遅刻は無断不参加として返金できません。<\/li><\/ul><\/details><\/div><\/section><section id=\"inquiry\" class=\"scroll-mt-24 border-b border-line py-6 text-ink-soft\" data-mk-note=\"消す（フッターの「企業・学校の方へ」「体験のご相談」と予約カードのリンクで足りる）\" data-mk-tone=\"remove\"><p>学校・会社・グループでの参加は、予約の前に相談できます。<!-- --> <a href=\"https://travel.niho.life/ja/inquiry?from=experience&amp;experience=community-dinner-with-locals&amp;title=%E9%8E%8C%E5%80%89%E3%81%AE%E4%BD%8F%E6%B0%91%E3%81%A8%E4%BD%9C%E3%81%A3%E3%81%A6%E5%9B%B2%E3%82%80%E3%82%B3%E3%83%9F%E3%83%A5%E3%83%8B%E3%83%86%E3%82%A3%E3%83%87%E3%82%A3%E3%83%8A%E3%83%BC\" class=\"font-extrabold text-moss underline underline-offset-4\">相談する<\/a><\/p><\/section><section id=\"seller\" class=\"border-b border-line py-6 text-sm text-ink-soft\" data-mk-note=\"施設名・社名の行をやめ、リンクだけをホストの欄の末尾へ移す（社名は表記ページの中に載っている）\" data-mk-tone=\"move\"><p>販売者：<b class=\"text-ink\">NIHO kamakura (Panasonic Holdings Corporation)<\/b>・<a href=\"https://travel.niho.life/ja/experiences/community-dinner-with-locals/seller\" rel=\"noopener noreferrer\" class=\"font-bold text-ink underline underline-offset-4\">特定商取引法に基づく表記<\/a><\/p><\/section><\/main><\/div><\/div><\/body><\/html>", "afterHost": "<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><style>__CSS__<\/style><style>\n[data-mk-note]{outline:2px dashed var(--mk,#c2410c);outline-offset:4px;position:relative;border-radius:6px}\n[data-mk-note]::after{content:attr(data-mk-note);position:absolute;left:0;top:calc(100% + 8px);z-index:40;background:var(--mk,#c2410c);color:#fff;font:700 11px/1.4 system-ui,sans-serif;padding:3px 8px;border-radius:6px;white-space:normal;max-width:min(420px,90vw);pointer-events:none}\n[data-mk-tone=remove]{--mk:#c2410c}\n[data-mk-tone=move]{--mk:#7c3aed}\n[data-mk-tone=new]{--mk:#15803d}\n[data-mk-tone=keep]{--mk:#0369a1}\n#seller[data-mk-note]{margin-bottom:34px}#inquiry[data-mk-note]{margin-bottom:56px}\n#host p[data-mk-note]{margin-bottom:30px}\nbody{background:#fff}\n<\/style><\/head><body><div class=\"container-page pb-16\"><div class=\"grid gap-x-8 gap-y-8 pt-5 lg:grid-cols-[minmax(0,1fr)_380px] lg:gap-x-[72px] lg:pt-7\"><header class=\"min-w-0 lg:col-start-1 lg:row-start-1\"><span class=\"hand inline-flex items-center gap-1.5 text-[1.375rem]\"><svg viewBox=\"0 0 24 24\" class=\"size-5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 11h16a8 8 0 0 1-16 0zM9 7c0-1.5 1-1.5 1-3M14 7c0-1.5 1-1.5 1-3\"><\/path><\/svg>cook &amp; eat<\/span><h1 class=\"text-[2.1 block font-extrabold\">1–8名<\/span><\/span><\/li><li class=\"flex min-w-0 items-center gap-2.5\"><span aria-hidden=\"true\" class=\"grid size-9 shrink-0 place-items-center rounded-full bg-sand text-moss\"><svg viewBox=\"0 0 24 24\" class=\"size-5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"5.5\" width=\"16\" height=\"15\" rx=\"2\"><\/rect><path d=\"M8 3.5v4M16 3.5v4M4 10h16M8 13.5h.01M12 13.5h.01M16 13.5h.01M8 17h.01M12 17h.01\"><\/path><\/svg><\/span><span class=\"min-w-0\"><span class=\"sr-only\">開催日時<!-- -->: <\/span><span class=\"block font-extrabold\">日 · 土 · 18:00 JST<\/span><\/span><\/li><\/ul><\/header><aside class=\"min-w-0 lg:col-start-2 lg:row-span-2 lg:row-start-1\"><section id=\"book\" aria-label=\"予約\" class=\"rounded-[var(--radius-card)] border border-line bg-white p-5\"><p class=\"eyebrow\">料金<\/p><p class=\"mt-1 flex flex-wrap items-center gap-x-3 gap-y-1 text-3xl font-extrabold\">¥30,000<!-- --> <span class=\"text-sm font-normal\">大人1名から<\/span><\/p><div class=\"mt-4 grid grid-cols-2 gap-2\"><button type=\"button\" class=\"min-h-[60px] min-w-0 rounded-xl border border-line-strong px-3 py-2 text-left hover:bg-sand\"><span class=\"block text-xs font-bold text-ink-soft\">日にち<\/span><span class=\"block truncate font-extrabold\">選択する<\/span><\/button><button type=\"button\" class=\"min-h-[60px] min-w-0 rounded-xl border border-line-strong px-3 py-2 text-left hover:bg-sand\"><span class=\"block text-xs font-bold text-ink-soft\">人数<\/span><span class=\"block truncate font-extrabold\">選択する<\/span><\/button><\/div><div class=\"mt-4\" aria-label=\"近日の開催日\"><p class=\"mb-2 text-xs font-extrabold text-ink-soft\">近い開催日<\/p><div class=\"flex flex-wrap gap-2\"><button type=\"button\" class=\"min-h-10 rounded-full border border-line-strong bg-white px-3 text-sm font-bold hover:bg-sand\">12月5日(土)<\/button><button type=\"button\" class=\"min-h-10 rounded-full border border-line-strong bg-white px-3 text-sm font-bold hover:bg-sand\">12月6日(日)<\/button><button type=\"button\" class=\"min-h-10 rounded-full border border-line-strong bg-white px-3 text-sm font-bold hover:bg-sand\">12月12日(土)<\/button><\/div><\/div><a href=\"https://travel.niho.life/ja/experiences/community-dinner-with-locals/book\" class=\"inline-flex min-h-12 items-center justify-center gap-2 rounded-full px-6 text-base font-extrabold transition-colors disabled:cursor-not-allowed disabled:opacity-60 bg-leaf text-ink hover:bg-leaf-hover mt-4 w-full\">日にちを選ぶ<\/a><\/section><a href=\"https://travel.niho.life/ja/inquiry?from=experience&amp;experience=community-dinner-with-locals&amp;title=%E9%8E%8C%E5%80%89%E3%81%AE%E4%BD%8F%E6%B0%91%E3%81%A8%E4%BD%9C%E3%81%A3%E3%81%A6%E5%9B%B2%E3%82%80%E3%82%B3%E3%83%9F%E3%83%A5%E3%83%8B%E3%83%86%E3%82%A3%E3%83%87%E3%82%A3%E3%83%8A%E3%83%BC\" class=\"mt-3 inline-flex min-h-11 items-center font-bold text-moss underline underline-offset-4\" data-mk-note=\"残す\" data-mk-tone=\"keep\">ほかの日・グループの相談<\/a><dialog aria-labelledby=\"experience-date-picker-title\" class=\"fixed m-0 max-h-[92dvh] w-full max-w-none overflow-y-auto rounded-t-[22px] rounded-b-none border border-line bg-white p-0 text-ink shadow-2xl backdrop:bg-ink/45 lg:max-h-[min(90dvh,760px)] lg:rounded-[var(--radius-card)]\"><div class=\"sticky top-0 z-10 flex items-start justify-between gap-4 border-b border-line bg-white px-5 py-4 sm:px-7\"><div><h2 id=\"experience-date-picker-title\" class=\"text-xl font-extrabold\">日にちと人数を選ぶ<\/h2><p class=\"mt-1 text-sm text-ink-soft\">大人1名 ¥30,000〜<\/p><\/div><button type=\"button\" autofocus=\"\" class=\"grid size-11 shrink-0 place-items-center rounded-full border border-line-strong text-2xl\" aria-label=\"閉じる\">×<\/button><\/div><div class=\"grid gap-5 p-5 sm:p-7\"><div role=\"group\" aria-label=\"開催日\"><p role=\"status\" class=\"rounded-xl border border-line-strong p-3 text-sm font-normal text-muted\">日時を読み込み中…<\/p><\/div><p class=\"text-sm text-ink-soft\">開催日を選ぶと、開始時刻と参加人数を選べます。<\/p><\/div><\/dialog><div class=\"fixed inset-x-0 bottom-0 z-30 flex items-center justify-between gap-3 border-t border-line bg-white px-4 py-3 lg:hidden\"><p class=\"min-w-0 text-[0.9375rem]\"><b class=\"text-[1.125rem]\">¥30,000<\/b><span class=\"text-[0.8125rem] text-ink-soft\">〜 / 人<!-- --> · 次回 12月5日(土)<\/span><\/p><button type=\"button\" class=\"inline-flex min-h-12 items-center justify-center gap-2 rounded-full px-6 text-base font-extrabold transition-colors disabled:cursor-not-allowed disabled:opacity-60 bg-leaf text-ink hover:bg-leaf-hover w-auto min-w-[132px] whitespace-nowrap\">日にちを選ぶ<\/button><\/div><\/aside><main class=\"min-w-0 lg:col-start-1 lg:row-start-2\"><section class=\"pt-6\" aria-label=\"概要\"><p class=\"text-lg leading-relaxed\">鎌倉駅から徒歩2分のNIHO kamakuraで、地域の住民と季節の家庭料理を作り、食卓を囲んで会話を楽しむ体験です。<\/p><ul class=\"mt-6 grid gap-3.5\"><li class=\"flex items-center gap-3.5\"><svg class=\"ico size-10\" viewBox=\"0 0 48 48\" aria-hidden=\"true\" focusable=\"false\"><defs><filter id=\"_S_2_\" x=\"-15%\" y=\"-15%\" width=\"130%\" height=\"130%\"><feTurbulence type=\"turbulence\" baseFrequency=\"0.045\" numOctaves=\"2\" seed=\"4\" result=\"t\"><\/feTurbulence><feDisplacementMap in=\"SourceGraphic\" in2=\"t\" scale=\"2.2\" xChannelSelector=\"R\" yChannelSelector=\"G\"><\/feDisplacementMap><\/filter><\/defs><g filter=\"url(#_S_2_)\"><path d=\"M10.6 25.4c3 2.6 5.4 5.6 7.6 9.4 4.6-9.4 11.4-17.6 19.8-23.6\" stroke-width=\"2.4\"><\/path><\/g><\/svg>地域の住民と季節の家庭料理を一緒に作る<\/li><li class=\"flex items-center gap-3.5\"><svg class=\"ico size-10\" viewBox=\"0 0 48 48\" aria-hidden=\"true\" focusable=\"false\"><defs><filter id=\"_S_3_\" x=\"-15%\" y=\"-15%\" width=\"130%\" height=\"130%\"><feTurbulence type=\"turbulence\" baseFrequency=\"0.045\" numOctaves=\"2\" seed=\"4\" result=\"t\"><\/feTurbulence><feDisplacementMap in=\"SourceGraphic\" in2=\"t\" scale=\"2.2\" xChannelSelector=\"R\" yChannelSelector=\"G\"><\/feDisplacementMap><\/filter><\/defs><g filter=\"url(#_S_3_)\"><path d=\"M10.6 25.4c3 2.6 5.4 5.6 7.6 9.4 4.6-9.4 11.4-17.6 19.8-23.6\" stroke-width=\"2.4\"><\/path><\/g><\/svg>一つの食卓を囲む食事と文化交流<\/li><li class=\"flex items-center gap-3.5\"><svg class=\"ico size-10\" viewBox=\"0 0 48 48\" aria-hidden=\"true\" focusable=\"false\"><defs><filter id=\"_S_4_\" x=\"-15%\" y=\"-15%\" width=\"130%\" height=\"130%\"><feTurbulence type=\"turbulence\" baseFrequency=\"0.045\" numOctaves=\"2\" seed=\"4\" result=\"t\"><\/feTurbulence><feDisplacementMap in=\"SourceGraphic\" in2=\"t\" scale=\"2.2\" xChannelSelector=\"R\" yChannelSelector=\"G\"><\/feDisplacementMap><\/filter><\/defs><g filter=\"url(#_S_4_)\"><path d=\"M10.6 25.4c3 2.6 5.4 5.6 7.6 9.4 4.6-9.4 11.4-17.6 19.8-23.6\" stroke-width=\"2.4\"><\/path><\/g><\/svg>鎌倉駅近くで最大8名の少人数体験<\/li><\/ul><\/section><section class=\"border-b border-line py-8 lg:py-10\"><h2 class=\"text-2xl\">体験内容<\/h2><div class=\"mt-4 space-y-3.5 whitespace-pre-line text-ink-soft\">ウェルカムドリンクと自己紹介のあと、ホストと一緒に旬の食材を使う家庭料理を4〜5品作ります。料理の経験は必要ありません。できあがった料理を一つのテーブルで囲み、鎌倉の日常や文化について話しましょう。\n\n献立は季節に応じて変わります。参加する住民や担当ホストは開催日によって異なり、英語力にも個人差があります。毎週土日18時〜20時、所要約2時間、定員8名の体験です。<\/div><\/section><section class=\"border-b border-line py-8 lg:py-10\"><h2 class=\"text-2xl\">料金に含まれるもの<\/h2><div class=\"mt-5 grid gap-7 sm:grid-cols-2\"><div><h3 class=\"font-extrabold\">含まれるもの<\/h3><ul class=\"mt-3 space-y-2 text-ink-soft\"><li class=\"flex gap-2\"><svg class=\"ico mt-0.5 size-5 shrink-0\" viewBox=\"0 0 48 48\" aria-hidden=\"true\" focusable=\"false\"><defs><filter id=\"_S_5_\" x=\"-15%\" y=\"-15%\" width=\"130%\" height=\"130%\"><feTurbulence type=\"turbulence\" baseFrequency=\"0.045\" numOctaves=\"2\" seed=\"4\" result=\"t\"><\/feTurbulence><feDisplacementMap in=\"SourceGraphic\" in2=\"t\" scale=\"2.2\" xChannelSelector=\"R\" yChannelSelector=\"G\"><\/feDisplacementMap><\/filter><\/defs><g filter=\"url(#_S_5_)\"><path d=\"M10.6 25.4c3 2.6 5.4 5.6 7.6 9.4 4.6-9.4 11.4-17.6 19.8-23.6\" stroke-width=\"2.4\"><\/path><\/g><\/svg>ウェルカムドリンク（ノンアルコール）<\/li><li class=\"flex gap-2\"><svg class=\"ico mt-0.5 size-5 shrink-0\" viewBox=\"0 0 48 48\" aria-hidden=\"true\" focusable=\"false\"><defs><filter id=\"_S_6_\" x=\"-15%\" y=\"-15%\" width=\"130%\" height=\"130%\"><feTurbulence type=\"turbulence\" baseFrequency=\"0.045\" numOctaves=\"2\" seed=\"4\" result=\"t\"><\/feTurbulence><feDisplacementMap in=\"SourceGraphic\" in2=\"t\" scale=\"2.2\" xChannelSelector=\"R\" yChannelSelector=\"G\"><\/feDisplacementMap><\/filter><\/defs><g filter=\"url(#_S_6_)\"><path d=\"M10.6 25.4c3 2.6 5.4 5.6 7.6 9.4 4.6-9.4 11.4-17.6 19.8-23.6\" stroke-width=\"2.4\"><\/path><\/g><\/svg>食材とホストとの料理体験<\/li><li class=\"flex gap-2\"><svg class=\"ico mt-0.5 size-5 shrink-0\" viewBox=\"0 0 48 48\" aria-hidden=\"true\" focusable=\"false\"><defs><filter id=\"_S_7_\" x=\"-15%\" y=\"-15%\" width=\"130%\" height=\"130%\"><feTurbulence type=\"turbulence\" baseFrequency=\"0.045\" numOctaves=\"2\" seed=\"4\" result=\"t\"><\/feTurbulence><feDisplacementMap in=\"SourceGraphic\" in2=\"t\" scale=\"2.2\" xChannelSelector=\"R\" yChannelSelector=\"G\"><\/feDisplacementMap><\/filter><\/defs><g filter=\"url(#_S_7_)\"><path d=\"M10.6 25.4c3 2.6 5.4 5.6 7.6 9.4 4.6-9.4 11.4-17.6 19.8-23.6\" stroke-width=\"2.4\"><\/path><\/g><\/svg>季節の料理4〜5品の夕食<\/li><li class=\"flex gap-2\"><svg class=\"ico mt-0.5 size-5 shrink-0\" viewBox=\"0 0 48 48\" aria-hidden=\"true\" focusable=\"false\"><defs><filter id=\"_S_8_\" x=\"-15%\" y=\"-15%\" width=\"130%\" height=\"130%\"><feTurbulence type=\"turbulence\" baseFrequency=\"0.045\" numOctaves=\"2\" seed=\"4\" result=\"t\"><\/feTurbulence><feDisplacementMap in=\"SourceGraphic\" in2=\"t\" scale=\"2.2\" xChannelSelector=\"R\" yChannelSelector=\"G\"><\/feDisplacementMap><\/filter><\/defs><g filter=\"url(#_S_8_)\"><path d=\"M10.6 25.4c3 2.6 5.4 5.6 7.6 9.4 4.6-9.4 11.4-17.6 19.8-23.6\" stroke-width=\"2.4\"><\/path><\/g><\/svg>会話と文化交流<\/li><\/ul><\/div><div><h3 class=\"font-extrabold\">含まれないもの<\/h3><ul class=\"mt-3 space-y-2 text-ink-soft\"><li class=\"flex gap-2\"><svg class=\"ico mt-0.5 size-5 shrink-0\" viewBox=\"0 0 48 48\" aria-hidden=\"true\" focusable=\"false\"><defs><filter id=\"_S_9_\" x=\"-15%\" y=\"-15%\" width=\"130%\" height=\"130%\"><feTurbulence type=\"turbulence\" baseFrequency=\"0.045\" numOctaves=\"2\" seed=\"4\" result=\"t\"><\/feTurbulence><feDisplacementMap in=\"SourceGraphic\" in2=\"t\" scale=\"2.2\" xChannelSelector=\"R\" yChannelSelector=\"G\"><\/feDisplacementMap><\/filter><\/defs><g filter=\"url(#_S_9_)\"><path d=\"M14.4 14.6c6.8 6 12.8 12.6 19.2 19.6M33.4 14.2c-6.8 6.2-13 12.8-18.8 19.8\"><\/path><\/g><\/svg>会場までの往復交通費<\/li><li class=\"flex gap-2\"><svg class=\"ico mt-0.5 size-5 shrink-0\" viewBox=\"0 0 48 48\" aria-hidden=\"true\" focusable=\"false\"><defs><filter id=\"_S_a_\" x=\"-15%\" y=\"-15%\" width=\"130%\" height=\"130%\"><feTurbulence type=\"turbulence\" baseFrequency=\"0.045\" numOctaves=\"2\" seed=\"4\" result=\"t\"><\/feTurbulence><feDisplacementMap in=\"SourceGraphic\" in2=\"t\" scale=\"2.2\" xChannelSelector=\"R\" yChannelSelector=\"G\"><\/feDisplacementMap><\/filter><\/defs><g filter=\"url(#_S_a_)\"><path d=\"M14.4 14.6c6.8 6 12.8 12.6 19.2 19.6M33.4 14.2c-6.8 6.2-13 12.8-18.8 19.8\"><\/path><\/g><\/svg>追加の飲み物<\/li><\/ul><\/div><\/div><\/section><section id=\"host\" aria-labelledby=\"host-heading\" class=\"scroll-mt-24 border-b border-line py-8 lg:py-10\">\n<h2 id=\"host-heading\" class=\"text-2xl\">ホストについて<\/h2>\n<div class=\"mt-4 flex items-start gap-4\">\n<div class=\"relative overflow-hidden bg-sand rounded-2xl size-20 shrink-0\"><img alt=\"NIHO kamakura\" src=\"https://travel.niho.life/api/public/experience-media/c3c1fd51-f1bf-4477-8868-eb6fa90ed290\" class=\"absolute inset-0 h-full w-full object-cover\"><\/div>\n<div class=\"min-w-0\"><p class=\"font-extrabold\">NIHO kamakura<\/p><p class=\"mt-1 text-sm text-ink-soft\">鎌倉駅まわり<\/p><\/div>\n<\/div>\n<p class=\"mt-3 whitespace-pre-line break-words text-ink-soft\">NIHO kamakura は、鎌倉駅西口から歩いて2分の「街のリビング」です。旅で訪れた人と、鎌倉に暮らす人が、同じテーブルで料理をして、食べて、話す。そんな時間を毎週末にひらいています。（モック用の仮文：v2 モックから引用。本番は未入力）<\/p>\n<p class=\"mt-5 text-sm\" data-mk-note=\"リンクだけ（販売者の社名・住所・連絡先はリンク先の表記ページ）\" data-mk-tone=\"new\"><a href=\"https://travel.niho.life/ja/experiences/community-dinner-with-locals/seller\" rel=\"noopener noreferrer\" class=\"font-bold text-ink underline underline-offset-4\">特定商取引法に基づく表記<\/a><\/p>\n<\/section><section id=\"place\" class=\"scroll-mt-24 border-b border-line py-8 lg:py-10\"><h2 class=\"text-2xl\">場所<\/h2><div class=\"mt-4 space-y-2 text-ink-soft\"><p>東京駅からJR横須賀線で約1時間（乗り換えなし）<\/p><p>正確な集合場所は、予約が確定したあとにお伝えします。<\/p><\/div><\/section><section id=\"know-before-you-go\" class=\"scroll-mt-24 border-b border-line py-8 lg:py-10\"><h2 class=\"text-2xl\">参加前にご確認ください<\/h2><div class=\"mt-4\"><h3 class=\"font-extrabold\">キャンセル<\/h3><ul class=\"mt-2 space-y-2 text-ink-soft\"><li>開始24時間前までキャンセル無料<\/li><\/ul><\/div><div class=\"mt-5\"><h3 class=\"font-extrabold\">参加に向かない条件<\/h3><ul class=\"mt-2 list-disc space-y-2 pl-5 text-ink-soft\"><li>食物アレルギーがある方：アレルギー対応はできません。<\/li><li>階段を利用できない方：会場は2階で、車いすでのアクセスはできません。<\/li><\/ul><\/div><div class=\"mt-5\"><h3 class=\"font-extrabold\">参加前の注意<\/h3><ul class=\"mt-2 list-disc space-y-2 pl-5 text-ink-soft\"><li>毎週土日18時〜20時（日本時間）。受付は開始48時間前までです。<\/li><li>カード決済の成立後、予約が即時に確定します。<\/li><li>0〜17歳の子どもは大人の同伴が必要です。<\/li><li>献立は食材の入荷状況により変わります。特定のホストや住民の参加は保証しません。<\/li><\/ul><details class=\"mt-3\"><summary class=\"min-h-11 cursor-pointer py-2 font-bold text-moss underline underline-offset-4\">すべての注意を見る<\/summary><ul class=\"list-disc space-y-2 pl-5 text-ink-soft\"><li>会場は2階で階段があります。喫煙はできません。<\/li><li>通常の雨天は屋内で開催します。荒天などで安全な開催が難しい場合は、日程変更または全額返金をご案内します。<\/li><li>交通機関が運休した場合は、開始前にご連絡ください。日程変更または全額返金をご相談できます。<\/li><li>お待ちできるのは15分までです。連絡のない15分超の遅刻は無断不参加として返金できません。<\/li><\/ul><\/details><\/div><\/section><\/main><\/div><\/div><\/body><\/html>", "afterNoHost": "<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" =community-dinner-with-locals&amp;title=%E9%8E%8C%E5%80%89%E3%81%AE%E4%BD%8F%E6%B0%91%E3%81%A8%E4%BD%9C%E3%81%A3%E3%81%A6%E5%9B%B2%E3%82%80%E3%82%B3%E3%83%9F%E3%83%A5%E3%83%8B%E3%83%86%E3%82%A3%E3%83%87%E3%82%A3%E3%83%8A%E3%83%BC\" class=\"mt-3 inline-flex min-h-11 items-center font-bold text-moss underline underline-offset-4\" data-mk-note=\"残す\" data-mk-tone=\"keep\">ほかの日・グループの相談<\/a><dialog aria-labelledby=\"experience-date-picker-title\" class=\"fixed m-0 max-h-[92dvh] w-full max-w-none overflow-y-auto rounded-t-[22px] rounded-b-none border border-line bg-white p-0 text-ink shadow-2xl backdrop:bg-ink/45 lg:max-h-[min(90dvh,760px)] lg:rounded-[var(--radius-card)]\"><div class=\"sticky top-0 z-10 flex items-start justify-between gap-4 border-b border-line bg-white px-5 py-4 sm:px-7\"><div><h2 id=\"experience-date-picker-title\" class=\"text-xl font-extrabold\">日にちと人数を選ぶ<\/h2><p class=\"mt-1 text-sm text-ink-soft\">大人1名 ¥30,000〜<\/p><\/div><button type=\"button\" autofocus=\"\" class=\"grid size-11 shrink-0 place-items-center rounded-full border border-line-strong text-2xl\" aria-label=\"閉じる\">×<\/button><\/div><div class=\"grid gap-5 p-5 sm:p-7\"><div role=\"group\" aria-label=\"開催日\"><p role=\"status\" class=\"rounded-xl border border-line-strong p-3 text-sm font-normal text-muted\">日時を読み込み中…<\/p><\/div><p class=\"text-sm text-ink-soft\">開催日を選ぶと、開始時刻と参加人数を選べます。<\/p><\/div><\/dialog><div class=\"fixed inset-x-0 bottom-0 z-30 flex items-center justify-between gap-3 border-t border-line bg-white px-4 py-3 lg:hidden\"><p class=\"min-w-0 text-[0.9375rem]\"><b class=\"text-[1.125rem]\">¥30,000<\/b><span class=\"text-[0.8125rem] text-ink-soft\">〜 / 人<!-- --> · 次回 12月5日(土)<\/span><\/p><button type=\"button\" class=\"inline-flex min-h-12 items-center justify-center gap-2 rounded-full px-6 text-base font-extrabold transition-colors disabled:cursor-not-allowed disabled:opacity-60 bg-leaf text-ink hover:bg-leaf-hover w-auto min-w-[132px] whitespace-nowrap\">日にちを選ぶ<\/button><\/div><\/aside><main class=\"min-w-0 lg:col-start-1 lg:row-start-2\"><section class=\"pt-6\" aria-label=\"概要\"><p class=\"text-lg leading-relaxed\">鎌倉駅から徒歩2分のNIHO kamakuraで、地域の住民と季節の家庭料理を作り、食卓を囲んで会話を楽しむ体験です。<\/p><ul class=\"mt-6 grid gap-3.5\"><li class=\"flex items-center gap-3.5\"><svg class=\"ico size-10\" viewBox=\"0 0 48 48\" aria-hidden=\"true\" focusable=\"false\"><defs><filter id=\"_S_2_\" x=\"-15%\" y=\"-15%\" width=\"130%\" height=\"130%\"><feTurbulence type=\"turbulence\" baseFrequency=\"0.045\" numOctaves=\"2\" seed=\"4\" result=\"t\"><\/feTurbulence><feDisplacementMap in=\"SourceGraphic\" in2=\"t\" scale=\"2.2\" xChannelSelector=\"R\" yChannelSelector=\"G\"><\/feDisplacementMap><\/filter><\/defs><g filter=\"url(#_S_2_)\"><path d=\"M10.6 25.4c3 2.6 5.4 5.6 7.6 9.4 4.6-9.4 11.4-17.6 19.8-23.6\" stroke-width=\"2.4\"><\/path><\/g><\/svg>地域の住民と季節の家庭料理を一緒に作る<\/li><li class=\"flex items-center gap-3.5\"><svg class=\"ico size-10\" viewBox=\"0 0 48 48\" aria-hidden=\"true\" focusable=\"false\"><defs><filter id=\"_S_3_\" x=\"-15%\" y=\"-15%\" width=\"130%\" height=\"130%\"><feTurbulence type=\"turbulence\" baseFrequency=\"0.045\" numOctaves=\"2\" seed=\"4\" result=\"t\"><\/feTurbulence><feDisplacementMap in=\"SourceGraphic\" in2=\"t\" scale=\"2.2\" xChannelSelector=\"R\" yChannelSelector=\"G\"><\/feDisplacementMap><\/filter><\/defs><g filter=\"url(#_S_3_)\"><path d=\"M10.6 25.4c3 2.6 5.4 5.6 7.6 9.4 4.6-9.4 11.4-17.6 19.8-23.6\" stroke-width=\"2.4\"><\/path><\/g><\/svg>一つの食卓を囲む食事と文化交流<\/li><li class=\"flex items-center gap-3.5\"><svg class=\"ico size-10\" viewBox=\"0 0 48 48\" aria-hidden=\"true\" focusable=\"false\"><defs><filter id=\"_S_4_\" x=\"-15%\" y=\"-15%\" width=\"130%\" height=\"130%\"><feTurbulence type=\"turbulence\" baseFrequency=\"0.045\" numOctaves=\"2\" seed=\"4\" result=\"t\"><\/feTurbulence><feDisplacementMap in=\"SourceGraphic\" in2=\"t\" scale=\"2.2\" xChannelSelector=\"R\" yChannelSelector=\"G\"><\/feDisplacementMap><\/filter><\/defs><g filter=\"url(#_S_4_)\"><path d=\"M10.6 25.4c3 2.6 5.4 5.6 7.6 9.4 4.6-9.4 11.4-17.6 19.8-23.6\" stroke-width=\"2.4\"><\/path><\/g><\/svg>鎌倉駅近くで最大8名の少人数体験<\/li><\/ul><\/section><section class=\"border-b border-line py-8 lg:py-10\"><h2 class=\"text-2xl\">体験内容<\/h2><div class=\"mt-4 space-y-3.5 whitespace-pre-line text-ink-soft\">ウェルカムドリンクと自己紹介のあと、ホストと一緒に旬の食材を使う家庭料理を4〜5品作ります。料理の経験は必要ありません。できあがった料理を一つのテーブルで囲み、鎌倉の日常や文化について話しましょう。\n\n献立は季節に応じて変わります。参加する住民や担当ホストは開催日によって異なり、英語力にも個人差があります。毎週土日18時〜20時、所要約2時間、定員8名の体験です。<\/div><\/section><section class=\"border-b border-line py-8 lg:py-10\"><h2 class=\"text-2xl\">料金に含まれるもの<\/h2><div class=\"mt-5 grid gap-7 sm:grid-cols-2\"><div><h3 class=\"font-extrabold\">含まれるもの<\/h3><ul class=\"mt-3 space-y-2 text-ink-soft\"><li class=\"flex gap-2\"><svg class=\"ico mt-0.5 size-5 shrink-0\" viewBox=\"0 0 48 48\" aria-hidden=\"true\" focusable=\"false\"><defs><filter id=\"_S_5_\" x=\"-15%\" y=\"-15%\" width=\"130%\" height=\"130%\"><feTurbulence type=\"turbulence\" baseFrequency=\"0.045\" numOctaves=\"2\" seed=\"4\" result=\"t\"><\/feTurbulence><feDisplacementMap in=\"SourceGraphic\" in2=\"t\" scale=\"2.2\" xChannelSelector=\"R\" yChannelSelector=\"G\"><\/feDisplacementMap><\/filter><\/defs><g filter=\"url(#_S_5_)\"><path d=\"M10.6 25.4c3 2.6 5.4 5.6 7.6 9.4 4.6-9.4 11.4-17.6 19.8-23.6\" stroke-width=\"2.4\"><\/path><\/g><\/svg>ウェルカムドリンク（ノンアルコール）<\/li><li class=\"flex gap-2\"><svg class=\"ico mt-0.5 size-5 shrink-0\" viewBox=\"0 0 48 48\" aria-hidden=\"true\" focusable=\"false\"><defs><filter id=\"_S_6_\" x=\"-15%\" y=\"-15%\" width=\"130%\" height=\"130%\"><feTurbulence type=\"turbulence\" baseFrequency=\"0.045\" numOctaves=\"2\" seed=\"4\" result=\"t\"><\/feTurbulence><feDisplacementMap in=\"SourceGraphic\" in2=\"t\" scale=\"2.2\" xChannelSelector=\"R\" yChannelSelector=\"G\"><\/feDisplacementMap><\/filter><\/defs><g filter=\"url(#_S_6_)\"><path d=\"M10.6 25.4c3 2.6 5.4 5.6 7.6 9.4 4.6-9.4 11.4-17.6 19.8-23.6\" stroke-width=\"2.4\"><\/path><\/g><\/svg>食材とホストとの料理体験<\/li><li class=\"flex gap-2\"><svg class=\"ico mt-0.5 size-5 shrink-0\" viewBox=\"0 0 48 48\" aria-hidden=\"true\" focusable=\"false\"><defs><filter id=\"_S_7_\" x=\"-15%\" y=\"-15%\" width=\"130%\" height=\"130%\"><feTurbulence type=\"turbulence\" baseFrequency=\"0.045\" numOctaves=\"2\" seed=\"4\" result=\"t\"><\/feTurbulence><feDisplacementMap in=\"SourceGraphic\" in2=\"t\" scale=\"2.2\" xChannelSelector=\"R\" yChannelSelector=\"G\"><\/feDisplacementMap><\/filter><\/defs><g filter=\"url(#_S_7_)\"><path d=\"M10.6 25.4c3 2.6 5.4 5.6 7.6 9.4 4.6-9.4 11.4-17.6 19.8-23.6\" stroke-width=\"2.4\"><\/path><\/g><\/svg>季節の料理4〜5品の夕食<\/li><li class=\"flex gap-2\"><svg class=\"ico mt-0.5 size-5 shrink-0\" viewBox=\"0 0 48 48\" aria-hidden=\"true\" focusable=\"false\"><defs><filter id=\"_S_8_\" x=\"-15%\" y=\"-15%\" width=\"130%\" height=\"130%\"><feTurbulence type=\"turbulence\" baseFrequency=\"0.045\" numOctaves=\"2\" seed=\"4\" result=\"t\"><\/feTurbulence><feDisplacementMap in=\"SourceGraphic\" in2=\"t\" scale=\"2.2\" xChannelSelector=\"R\" yChannelSelector=\"G\"><\/feDisplacementMap><\/filter><\/defs><g filter=\"url(#_S_8_)\"><path d=\"M10.6 25.4c3 2.6 5.4 5.6 7.6 9.4 4.6-9.4 11.4-17.6 19.8-23.6\" stroke-width=\"2.4\"><\/path><\/g><\/svg>会話と文化交流<\/li><\/ul><\/div><div><h3 class=\"font-extrabold\">含まれないもの<\/h3><ul class=\"mt-3 space-y-2 text-ink-soft\"><li class=\"flex gap-2\"><svg class=\"ico mt-0.5 size-5 shrink-0\" viewBox=\"0 0 48 48\" aria-hidden=\"true\" focusable=\"false\"><defs><filter id=\"_S_9_\" x=\"-15%\" y=\"-15%\" width=\"130%\" height=\"130%\"><feTurbulence type=\"turbulence\" baseFrequency=\"0.045\" numOctaves=\"2\" seed=\"4\" result=\"t\"><\/feTurbulence><feDisplacementMap in=\"SourceGraphic\" in2=\"t\" scale=\"2.2\" xChannelSelector=\"R\" yChannelSelector=\"G\"><\/feDisplacementMap><\/filter><\/defs><g filter=\"url(#_S_9_)\"><path d=\"M14.4 14.6c6.8 6 12.8 12.6 19.2 19.6M33.4 14.2c-6.8 6.2-13 12.8-18.8 19.8\"><\/path><\/g><\/svg>会場までの往復交通費<\/li><li class=\"flex gap-2\"><svg class=\"ico mt-0.5 size-5 shrink-0\" viewBox=\"0 0 48 48\" aria-hidden=\"true\" focusable=\"false\"><defs><filter id=\"_S_a_\" x=\"-15%\" y=\"-15%\" width=\"130%\" height=\"130%\"><feTurbulence type=\"turbulence\" baseFrequency=\"0.045\" numOctaves=\"2\" seed=\"4\" result=\"t\"><\/feTurbulence><feDisplacementMap in=\"SourceGraphic\" in2=\"t\" scale=\"2.2\" xChannelSelector=\"R\" yChannelSelector=\"G\"><\/feDisplacementMap><\/filter><\/defs><g filter=\"url(#_S_a_)\"><path d=\"M14.4 14.6c6.8 6 12.8 12.6 19.2 19.6M33.4 14.2c-6.8 6.2-13 12.8-18.8 19.8\"><\/path><\/g><\/svg>追加の飲み物<\/li><\/ul><\/div><\/div><\/section><section id=\"place\" class=\"scroll-mt-24 border-b border-line py-8 lg:py-10\"><h2 class=\"text-2xl\">場所<\/h2><div class=\"mt-4 space-y-2 text-ink-soft\"><p>東京駅からJR横須賀線で約1時間（乗り換えなし）<\/p><p>正確な集合場所は、予約が確定したあとにお伝えします。<\/p><\/div><\/section><section id=\"know-before-you-go\" class=\"scroll-mt-24 border-b border-line py-8 lg:py-10\"><h2 class=\"text-2xl\">参加前にご確認ください<\/h2><div class=\"mt-4\"><h3 class=\"font-extrabold\">キャンセル<\/h3><ul class=\"mt-2 space-y-2 text-ink-soft\"><li>開始24時間前までキャンセル無料<\/li><\/ul><\/div><div class=\"mt-5\"><h3 class=\"font-extrabold\">参加に向かない条件<\/h3><ul class=\"mt-2 list-disc space-y-2 pl-5 text-ink-soft\"><li>食物アレルギーがある方：アレルギー対応はできません。<\/li><li>階段を利用できない方：会場は2階で、車いすでのアクセスはできません。<\/li><\/ul><\/div><div class=\"mt-5\"><h3 class=\"font-extrabold\">参加前の注意<\/h3><ul class=\"mt-2 list-disc space-y-2 pl-5 text-ink-soft\"><li>毎週土日18時〜20時（日本時間）。受付は開始48時間前までです。<\/li><li>カード決済の成立後、予約が即時に確定します。<\/li><li>0〜17歳の子どもは大人の同伴が必要です。<\/li><li>献立は食材の入荷状況により変わります。特定のホストや住民の参加は保証しません。<\/li><\/ul><details class=\"mt-3\"><summary class=\"min-h-11 cursor-pointer py-2 font-bold text-moss underline underline-offset-4\">すべての注意を見る<\/summary><ul class=\"list-disc space-y-2 pl-5 text-ink-soft\"><li>会場は2階で階段があります。喫煙はできません。<\/li><li>通常の雨天は屋内で開催します。荒天などで安全な開催が難しい場合は、日程変更または全額返金をご案内します。<\/li><li>交通機関が運休した場合は、開始前にご連絡ください。日程変更または全額返金をご相談できます。<\/li><li>お待ちできるのは15分までです。連絡のない15分超の遅刻は無断不参加として返金できません。<\/li><\/ul><\/details><\/div><\/section><section id=\"seller\" class=\"border-b border-line py-6 text-sm text-ink-soft\" data-mk-note=\"ホストの欄が無い体験は、リンクだけを今の位置に置く\" data-mk-tone=\"new\"><p><a href=\"https://travel.niho.life/ja/experiences/community-dinner-with-locals/seller\" rel=\"noopener noreferrer\" class=\"font-bold text-ink underline underline-offset-4\">特定商取引法に基づく表記<\/a><\/p><\/section><\/main><\/div><\/div><\/body><\/html>", "seller": "<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><style>__CSS__<\/style><style>\n[data-mk-note]{outline:2px dashed var(--mk,#c2410c);outline-offset:4px;position:relative;border-radius:6px}\n[data-mk-note]::after{content:attr(data-mk-note);position:absolute;left:0;top:calc(100% + 8px);z-index:40;background:var(--mk,#c2410c);color:#fff;font:700 11px/1.4 system-ui,sans-serif;padding:3px 8px;border-radius:6px;white-space:normal;max-width:min(420px,90vw);pointer-events:none}\n[data-mk-tone=remove]{--mk:#c2410c}\n[data-mk-tone=move]{--mk:#7c3aed}\n[data-mk-tone=new]{--mk:#15803d}\n[data-mk-tone=keep]{--mk:#0369a1}\n#seller[data-mk-note]{margin-bottom:34px}#inquiry[data-mk-note]{margin-bottom:56px}\n#host p[data-mk-note]{margin-bottom:30px}\nbody{background:#fff}\n.mk-wrap{max-width:1280px;margin:0 auto;padding:32px 24px;display:grid;gap:48px;grid-template-columns:1fr}@media(min-width:900px){.mk-wrap{grid-template-columns:1fr 1fr}}.mk-row{display:grid;gap:6px;padding:16px 0}@media(min-width:768px){.mk-row{grid-template-columns:150px minmax(0,1fr);gap:20px}}.mk-col{display:inline-block;margin-bottom:14px;padding:3px 10px;border-radius:999px;background:#f1f0ec;font:800 12px system-ui;color:#444}.mk-col-after{background:#15803d;color:#fff}[data-mk-note]{margin-bottom:34px}<\/style><\/head><body style=\"background:#f7f5f0\"><div class=\"mk-wrap\">\n<div><p class=\"mk-col\">現状<\/p><div class=\"mb-3.5 flex items-center justify-between gap-4 md:mb-[18px] md:items-end\"><h1 class=\"shrink-0 font-display text-[1.375rem] leading-[1.2] font-medium tracking-[-0.01em] md:text-[1.625rem]\">販売者表示<\/h1><\/div>\n<p class=\"mb-4 text-ink-soft\">体験を販売する方の公開情報を準備し、公開前に内容を確認します。法的な適合性を自動で保証する機能ではありません。<\/p>\n<div class=\"space-y-4\">\n<section class=\"rounded-2xl border border-line bg-canvas p-4 sm:p-5\" data-mk-note=\"「公開方法」の欄ごと消す\" data-mk-tone=\"remove\">\n<h2 class=\"font-extrabold\">公開方法<\/h2>\n<p class=\"mt-2 rounded-xl bg-warn-pale p-3 text-sm font-bold\">ここへ入力する氏名・住所・電話番号・メールアドレスは、旅行者に公開されます。NIHOの本人情報やStripeの確認情報は自動でコピーされません。<\/p>\n<fieldset class=\"mt-4 grid gap-2\"><legend class=\"font-bold\">表示方法<\/legend>\n<label class=\"flex min-h-11 items-center gap-2\"><input type=\"radio\" name=\"m1\" checked> このサイトに公開情報を入力する<\/label>\n<label class=\"flex min-h-11 items-center gap-2\"><input type=\"radio\" name=\"m1\"> 自分の既存の販売者表示（https）へ案内する<\/label>\n<\/fieldset>\n<\/section>\n<section class=\"mt-10 rounded-2xl border border-line bg-canvas p-4 sm:p-5\">\n<h2 class=\"font-extrabold\">販売者情報<\/h2>\n<div class=\"mt-4 grid gap-4\">\n<label class=\"grid gap-1 font-bold\">販売者区分<select class=\"min-h-11 w-full rounded-xl border border-line-strong bg-canvas px-3 py-2 disabled:bg-sand\"><option>個人<\/option><option selected>法人・事業者<\/option><\/select><\/label>\n<label class=\"grid gap-1 font-bold\">氏名・名称<input class=\"min-h-11 w-full rounded-xl border border-line-strong bg-canvas px-3 py-2 disabled:bg-sand\" value=\"NIHO kamakura (Panasonic Holdings Corporation)\" disabled><span class=\"text-xs font-normal text-muted\">Experienceの法的販売者名と一致させています。この画面では変更できません。<\/span><\/label>\n<label class=\"grid gap-1 font-bold\">業務責任者<input class=\"min-h-11 w-full rounded-xl border border-line-strong bg-canvas px-3 py-2 disabled:bg-sand\" value=\"（サンプル）鎌倉 太郎\"><\/label>\n<label class=\"grid gap-1 font-bold\">公開用住所<textarea class=\"min-h-11 w-full rounded-xl border border-line-strong bg-canvas px-3 py-2 disabled:bg-sand\" rows=\"3\">（サンプル）神奈川県鎌倉市〇〇 1-2-3<\/textarea><\/label>\n<label class=\"grid gap-1 font-bold\">公開用電話番号<input class=\"min-h-11 w-full rounded-xl border border-line-strong bg-canvas px-3 py-2 disabled:bg-sand\" value=\"（サンプル）0467-00-0000\"><\/label>\n<label class=\"grid gap-1 font-bold\">公開用メールアドレス<input class=\"min-h-11 w-full rounded-xl border border-line-strong bg-canvas px-3 py-2 disabled:bg-sand\" value=\"seller@example.jp\"><\/label>\n<\/div>\n<label class=\"mt-5 flex items-start gap-2 rounded-xl bg-sand p-3 font-bold\"><input class=\"mt-1\" type=\"checkbox\">入力内容が公開されることを確認し、この版の公開に同意します。<\/label>\n<div class=\"mt-5 flex flex-wrap gap-2\"><button class=\"inline-flex shrink-0 items-center justify-center gap-1.5 whitespace-nowrap rounded-full border font-extrabold leading-none transition-colors h-12 px-6 text-[0.9375rem] border-transparent bg-leaf text-ink\" disabled>確認して保存<\/button><button class=\"inline-flex shrink-0 items-center justify-center gap-1.5 whitespace-nowrap rounded-full border font-extrabold leading-none transition-colors h-12 px-6 text-[0.9375rem] border-line-strong bg-canvas text-ink\">現在値を再読込<\/button><\/div>\n<\/section>\n<\/div><\/div>\n<div><p class=\"mk-col mk-col-after\">修正後<\/p><div class=\"mb-3.5 flex items-center justify-between gap-4 md:mb-[18px] md:items-end\"><h1 class=\"shrink-0 font-display text-[1.375rem] leading-[1.2] font-medium tracking-[-0.01em] md:text-[1.625rem]\">販売者表示<\/h1><\/div>\n<p class=\"mb-4 text-ink-soft\" data-mk-note=\"説明を「何に載るか」に変える\" data-mk-tone=\"new\">ここで入力した内容は、旅行者向けの「特定商取引法に基づく表記」ページに載ります。ページは体験ごとにこのサイトが作り、料金・キャンセル条件も自動で載せます。<\/p>\n<div class=\"space-y-4\">\n<section class=\"mt-8 rounded-2xl border border-line bg-canvas p-4 sm:p-5\">\n<h2 class=\"font-extrabold\">販売者情報<\/h2>\n<p class=\"mt-2 rounded-xl bg-warn-pale p-3 text-sm font-bold\">ここへ入力する氏名・住所・電話番号・メールアドレスは、旅行者に公開されます。NIHOの本人情報やStripeの確認情報は自動でコピーされません。<\/p>\n<div class=\"mt-4 grid gap-4\">\n<label class=\"grid gap-1 font-bold\">販 =\"mt-4 text-sm\" data-mk-note=\"公開中の体験があるときだけ出す\" data-mk-tone=\"new\"><a class=\"font-bold text-moss underline underline-offset-4\" href=\"https://travel.niho.life/ja/experiences/community-dinner-with-locals/seller\">公開中の表記を見る：鎌倉の住民と作って囲むコミュニティディナー<\/a><\/p>\n<\/section>\n<\/div><\/div><\/div><\/body><\/html>", "register": "<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><style>__CSS__<\/style><style>\n[data-mk-note]{outline:2px dashed var(--mk,#c2410c);outline-offset:4px;position:relative;border-radius:6px}\n[data-mk-note]::after{content:attr(data-mk-note);position:absolute;left:0;top:calc(100% + 8px);z-index:40;background:var(--mk,#c2410c);color:#fff;font:700 11px/1.4 system-ui,sans-serif;padding:3px 8px;border-radius:6px;white-space:normal;max-width:min(420px,90vw);pointer-events:none}\n[data-mk-tone=remove]{--mk:#c2410c}\n[data-mk-tone=move]{--mk:#7c3aed}\n[data-mk-tone=new]{--mk:#15803d}\n[data-mk-tone=keep]{--mk:#0369a1}\n#seller[data-mk-note]{margin-bottom:34px}#inquiry[data-mk-note]{margin-bottom:56px}\n#host p[data-mk-note]{margin-bottom:30px}\nbody{background:#fff}\n.mk-wrap{max-width:1280px;margin:0 auto;padding:32px 24px;display:grid;gap:48px;grid-template-columns:1fr}@media(min-width:900px){.mk-wrap{grid-template-columns:1fr 1fr}}.mk-row{display:grid;gap:6px;padding:16px 0}@media(min-width:768px){.mk-row{grid-template-columns:150px minmax(0,1fr);gap:20px}}.mk-col{display:inline-block;margin-bottom:14px;padding:3px 10px;border-radius:999px;background:#f1f0ec;font:800 12px system-ui;color:#444}.mk-col-after{background:#15803d;color:#fff}[data-mk-note]{margin-bottom:34px}<\/style><\/head><body style=\"background:#f7f5f0\"><div class=\"mk-wrap\">\n<div><p class=\"mk-col\">現状<\/p><h2 class=\"font-extrabold text-lg\">ホスト登録（/host/register）<\/h2>\n<div class=\"mt-3 rounded-2xl border border-line bg-canvas px-4 sm:px-5\">\n<div class=\"mk-row border-b border-line\"><span class=\"font-bold\">掲載名<\/span><div><input class=\"min-h-11 w-full max-w-md rounded-xl border border-line-strong bg-canvas px-3 py-2\" value=\"NIHO kamakura\"><p class=\"mt-1 text-xs text-muted\">体験ページに「提供者」として表示する名前です。<\/p><\/div><\/div>\n<div class=\"mk-row border-b border-line border-b-0\" data-mk-note=\"欄ごと消す（販売者表示は登録後に［設定 › 販売者表示］で入力）\" data-mk-tone=\"remove\"><span class=\"font-bold\">特商法表示 URL<\/span><div><input class=\"min-h-11 w-full max-w-md rounded-xl border border-line-strong bg-canvas px-3 py-2\" placeholder=\"https://\"><p class=\"mt-1 text-xs text-muted\">掲載の審査までに https のページを用意してください。<\/p><\/div><\/div>\n<\/div>\n<h2 class=\"mt-14 font-extrabold text-lg\">運営の代行準備（/admin の準備フォーム）<\/h2>\n<div class=\"mt-3 rounded-2xl border border-line bg-canvas p-4 sm:p-5 grid gap-3\">\n<label class=\"grid gap-1 font-bold\">提供者名<input class=\"min-h-11 w-full max-w-md rounded-xl border border-line-strong bg-canvas px-3 py-2\" value=\"（サンプル）鎌倉の陶芸工房\"><\/label>\n<label class=\"grid gap-1 font-bold\" data-mk-note=\"欄ごと消す\" data-mk-tone=\"remove\">特商法等の表示URL<input class=\"min-h-11 w-full max-w-md rounded-xl border border-line-strong bg-canvas px-3 py-2\" placeholder=\"https://\"><\/label>\n<\/div><\/div>\n<div><p class=\"mk-col mk-col-after\">修正後<\/p><h2 class=\"font-extrabold text-lg\">ホスト登録（/host/register）<\/h2>\n<div class=\"mt-3 rounded-2xl border border-line bg-canvas px-4 sm:px-5\">\n<div class=\"mk-row border-b border-line border-b-0\"><span class=\"font-bold\">掲載名<\/span><div><input class=\"min-h-11 w-full max-w-md rounded-xl border border-line-strong bg-canvas px-3 py-2\" value=\"NIHO kamakura\"><p class=\"mt-1 text-xs text-muted\">体験ページに「提供者」として表示する名前です。<\/p><\/div><\/div>\n<\/div>\n<h2 class=\"mt-14 font-extrabold text-lg\">運営の代行準備（/admin の準備フォーム）<\/h2>\n<div class=\"mt-3 rounded-2xl border border-line bg-canvas p-4 sm:p-5 grid gap-3\">\n<label class=\"grid gap-1 font-bold\">提供者名<input class=\"min-h-11 w-full max-w-md rounded-xl border border-line-strong bg-canvas px-3 py-2\" value=\"（サンプル）鎌倉の陶芸工房\"><\/label>\n<p class=\"text-sm text-ink-soft\" data-mk-note=\"URLの代わりに案内だけ\" data-mk-tone=\"new\">販売者表示は、ホスト本人が登録後に［設定 › 販売者表示］で入力します。<\/p>\n<\/div><\/div><\/div><\/body><\/html>"}};
const WHY = {
  before: "<b>本番の今</b>：ページの下に「学校・会社・グループ…相談する」と「販売者：…・特定商取引法に基づく表記」が2行並ぶ。コミュニティディナーは提供者の掲載名・紹介文が未入力なので、ホストの欄そのものが出ていない。",
  afterHost: "<b>修正後（ホストの欄がある体験）</b>：相談の行を消す。「販売者：施設名（社名）」の行はやめ、「特定商取引法に基づく表記」のリンクだけをホストの欄の末尾に置く。社名・住所・連絡先はリンク先（このサイトが作る /ja/experiences/{slug}/seller）に載る。※ディナーでこの形にするには、提供者の掲載名・紹介文の入力が要る（紹介文はv2モックの仮文）。",
  afterNoHost: "<b>修正後（ホストの欄が無い体験）</b>：相談の行を消し、販売者の行はリンクだけにして今の位置（ページ末尾）に置く。今日のディナーはこの形になる。",
  seller: "<b>/host/seller</b>：「表示方法」の選択（このサイトに入力／既存の https へ案内）をなくし、入力だけにする。説明は「どのページに載るか」に変える。保存済みの外部URLは旅行者側では使わなくなる（移行は実装時に扱う）。",
  register: "<b>入力欄</b>：ホスト登録の「特商法表示 URL」と、運営の代行準備の「特商法等の表示URL」を消す。販売者表示は登録後にホスト本人が［設定 › 販売者表示］で入力する。"
};
let tab = "page", variant = "before", width = "pc";
const frame = document.getElementById("frame");
function render(){
  const key = tab === "page" ? variant : tab;
  frame.srcdoc = DATA.docs[key].replace("__CSS__", () => DATA.css);
  frame.className = tab === "page" && width === "phone" ? "phone" : "";
  document.getElementById("why").innerHTML = WHY[key];
  document.getElementById("pageControls").hidden = tab !== "page";
  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-pressed", b.dataset.tab === tab));
  document.querySelectorAll("[data-variant]").forEach(b => b.setAttribute("aria-pressed", b.dataset.variant === variant));
  document.querySelectorAll("[data-width]").forEach(b => b.setAttribute("aria-pressed", b.dataset.width === width));
}
document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
document.querySelectorAll("[data-variant]").forEach(b => b.onclick = () => { variant = b.dataset.variant; render(); });
document.querySelectorAll("[data-width]").forEach(b => b.onclick = () => { width = b.dataset.width; render(); });
frame.addEventListener("load", () => {
  const target = frame.contentDocument.querySelector("[data-mk-tone=new],[data-mk-tone=remove],[data-mk-tone=move]");
  if (tab === "page" && target) target.scrollIntoView({block: "center"});
});
const [h1, h2, h3] = location.hash.slice(1).split("/");
if (DATA.docs[h1] && h1 !== "before" && !h1.startsWith("after")) tab = h1;
if (h1 === "page" && DATA.docs[h2]) variant = h2;
if (h3 === "phone") width = "phone";
render();
</script>
