  論点: 日常の5入口、設定の集約、公開順の本文＋掲載レール、日英の切替。
  参照: experience-provider-workspace-v2.html（2026-10-21）、docs/design-brief.md、docs/design-system.md、ADR 0002/0003。
  現行の自己公開・停止・再開、予約・返金確認、在庫・権限・販売者・口座確認を残す。旧審査へ戻さない。
  設定の通知・チーム・販売者表示は、別セッションで実装する完成後の配置を合成状態で示す。

  予約・氏名・メール・金額・開催枠・写真はすべて合成。サーバー通信・storage・実サービスへの遷移なし。

function settingsDetail(){let body='';const p=state.page;if(p==='provider')body=section('公開プロフィール',`<div class="formbody">${field('掲載名','providerName',state.providerName)}${field('提供者の紹介','providerBio','食卓や手仕事を通じて、地域の日常を旅する人と分かち合います。',4)}<label class="field"><span>提供者の写真</span><button type="button" class="btn" data-action="photo-settings">写真を選ぶ</button></label></div>`);

if(p==='payout')body=section('売上を受け取る口座',`<div class="formbody"><div class="actions"><span class="pill live">準備済み</span><strong>サンプルキッチンの口座</strong></div><p class="soft">この口座で売上を受け取ることに同意しています。</p>${btn('Stripe で確認','stripe')}<details class="fold" style="padding:0"><summary>口座利用の同意</summary><div class="foldbody"><p class="help">同意を取り消すと公開中の体験が停止し、新しい予約を受けられなくなります。</p>${btn('口座利用の同意を取り消す','revoke-payout')}</div></details></div>`);
if(p==='notifications')body=section('宛先',`<div class="formbody"><p>${esc(state.notificationEmail)}</p>${btn('宛先を変える','change-email')}${state.pendingEmail?`<p class="notice warn">${esc(state.pendingEmail)} の確認待ち</p>`:''}</div>`)+`<div class="spaced">`+section('受け取る通知',`<div class="formbody" style="gap:0">${[['message','ゲストからの質問・連絡'],['summary','前日の参加者のまとめ'],['review','新しいレビュー']].map(([k,t])=>`<label class="switchrow"><span>${t}</span><input type="checkbox" class="switch" data-notification="${k}" ${state.notifications[k]?'checked':''} aria-label="${t}"></label>`).join('')}<details class="fold" style="padding:16px 0 0"><summary>必ず届く通知</summary><div class="foldbody">${['新しい予約・申込','予約の取消','予約者へのメールの不達','掲載の運営停止・解除'].map(t=>`<div class="switchrow"><span>${t}</span><span class="always">常に通知</span></div>`).join('')}</div></details></div>`)+`</div>`;
if(p==='connection')body=section('Google カレンダー',`<div class="formbody"><div class="actions"><span class="pill ${state.googleConnected?'live':''}">${state.googleConnected?'接続中':'未接続'}</span><span>サンプルキッチン</span></div><p class="soft">予定がある時間は、重なる開催枠の予約を受け付けません。</p>${btn(state.googleConnected?'接続を切る':'Google カレンダーをつなぐ','google')}<details class="fold" style="padding:0"><summary>空き状況・書き込み先</summary><div class="foldbody"><p class="help">空き状況を最後に確認: 今日 15:30</p><label class="check"><input type="checkbox" checked>確定した予約を専用カレンダーに追加する</label></div></details></div>`);
if(p==='team')body=section('運営する人',`<div class="row"><span class="avatar">H</span><div class="grow"><div class="rowtitle">ホストA</div><div class="detail">オーナー</div></div><span class="pill">あなた</span></div>${state.teammate?`<div class="row"><span class="avatar">C</span><div class="grow"><div class="rowtitle">ホストC</div><div class="detail">サブホスト</div></div>${btn('外す','remove-team')}</div>`:''}<div class="formbody"><label class="field"><span>追加する人のメールアドレス</span><input type="email" id="team-email" placeholder="cohost@example.com"></label>${btn('サブホストを追加','add-team')}</div>`);
if(p==='support')body=section('サポートの利用',`<div class="formbody"><label class="switchrow"><span>予約対応のサポートを利用する</span><input type="checkbox" class="switch" id="support-choice" ${state.support?'checked':''} aria-label="予約対応のサポート"></label>${btn('利用条件・手数料を確認','support-terms')}<p class="help">変更は確認した条件に従って適用されます。</p></div>`);
if(p==='account')body=section('ログイン',`<div class="formbody"><p class="label">ログインのメール</p><p>host@example.com</p><p class="help">メールのログインリンクでログインします。</p>${btn('ログアウト','logout')}</div>`);

const noSave=['payout','connection','team','account','device'].includes(p);return back()+head(titles[p])+`<div class="settingdetail">${body}${noSave?'':`<div class="settings-form-footer">${link('settings','戻る','btn')}${btn(p==='seller'?'確認して公開':'保存','save-setting',true)}</div>`}</div>`}
function messages(){return back('home','ホーム')+head('メッセージ')+section('ゲストA · 今日の料理体験',`<div class="conversation"><p class="detail">今日 12:30 · 英語から翻訳</p><div class="bubble">野菜中心の食事を希望しています。対応できますか？</div>${state.replySent?'<div class="bubble mine">はい、野菜中心のお料理をご用意できます。当日お待ちしています。</div>':''}${field('返信（日本語）','reply','はい、野菜中心のお料理をご用意できます。当日お待ちしています。',3)}<div class="actions">${btn('英語を確認して送る','send-reply',true)}</div></div>`)+`<div class="spaced">${link('reviews','レビューを見る','textlink')} <span class="muted"> · </span> ${link('translate','対面通訳','textlink')}</div>`}
function reviews(){return back('home','ホーム')+head('レビュー')+section('ゲストD',`<div class="formbody"><p>料理を一緒に作り、ゆっくり会話できて楽しかったです。</p>${field('返信','reviewReply','お越しいただきありがとうございました。',3)}${btn('返信を確認','review-reply')}</div>`)}
function guides(){return back('experiences','体験')+head('予約後の集合案内')+`<div class="settingdetail">`+section(esc(state.title),`<div class="formbody">${field('集合場所','meetingName','サンプルキッチン')}${field('地図のURL','meetingMap','https://example.com/map',0,'url')}${field('入口・当日の案内','guide',state.guide,4)}<p class="help">予約が確定したゲストに表示します。</p></div>`)+`<div class="settings-form-footer">${btn('保存','save-setting',true)}</div></div>`}

function render(){shell();let html=state.page==='home'?home():state.page==='experiences'?experiences():state.page==='editor'?editor():state.page==='calendar'?calendar():state.page==='bookings'?bookings():state.page==='sales'?sales():state.page==='settings'?settings():state.page==='messages'?messages():state.page==='reviews'?reviews():state.page==='guides'?guides():state.page==='translate'?translatePage():settingsDetail();$('#content').innerHTML=`<div class="page">${html}</div>`;document.title=(state.page==='editor'?'体験の編集':titles[state.page]||({home:'ホーム',experiences:'体験',calendar:'カレンダー',bookings:'予約',sales:'売上',settings:'設定',messages:'メッセージ',reviews:'レビュー',guides:'集合案内',translate:'対面通訳'}[state.page]))+' | ホスト画面 改善案';}
function navigate(page){if(state.page==='editor'&&state.dirty&&page!=='editor'){openDialog('変更を保存しますか？','<p>保存していない入力があります。</p>',`<button type="button" class="btn" data-dialog-go="${page}">保存せずに移動</button><button type="button" class="btn primary" data-dialog-save-go="${page}">保存して移動</button>`);return}state.page=page;render();window.scrollTo({top:0,behavior:'instant'})}
let toastTimer;function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,2800)}
function openDialog(title,body,footer=''){const d=$('#dialog');d.innerHTML=`<div class="dialoghead"><h2 id="dialog-title">${title}</h2><button type="button" class="close" data-close aria-label="閉じる">×</button></div><div class="dialogbody">${body}</div><div class="dialogfoot">${btn('戻る','close')}${footer}</div>`;if(!d.open)d.showModal()}
function closeDialog(){if($('#dialog').open)$('#dialog').close()}
function save(){state.dirty=false;render();toast(state.product==='coffee'?'下書きを保存しました':'保存しました。公開中の内容を更新しました。')}
function action(a){if(a==='close'){closeDialog();return}if(a==='dinner'||a==='coffee'){state.product=a==='dinner'?'dinner':'coffee';state.englishConfirmed=a==='dinner';state.tab='page';navigate('editor');return}if(a==='save'){save();return}if(a==='publish'){if(state.dirty){toast('入力を保存してから公開してください');return}if(!state.englishConfirmed){state.lang='en';render();toast('英語原稿を確認してください');return}if(!state.policyAgreed){toast('掲載条件への同意を確認してください');return}openDialog('この体験を公開しますか？','<p>保存済みの原稿・料金・開催枠・販売者情報を公開し、新しい予約の受付を始めます。</p>',btn('同意して公開','publish-confirm',true));return}if(a==='publish-confirm'){if(state.product==='coffee')state.coffeePublished=true;else state.published=true;closeDialog();render();toast('公開しました');return}if(a==='stop'){openDialog('新しい予約を停止しますか？','<p>すでに確定した予約はそのまま残ります。</p>',btn('予約受付を停止','stop-confirm',true));return}if(a==='stop-confirm'){if(state.product==='coffee')state.coffeePublished=false;else state.published=false;closeDialog();render();toast('新しい予約を停止しました');return}if(a==='preview'||a==='public-site'){openDialog('旅行者向けプレビュー',`<div class="preview-hero">${icon('food')}</div><h3>${esc(state.englishTitle)}</h3><p>${esc(state.englishLead)}</p><p class="soft">2 hours · Japanese and English · ¥${Number(state.adult).toLocaleString()} / person</p>`);return}if(a==='translate'){state.englishTitle='Seasonal cooking around one table';state.englishLead='Cook with seasonal ingredients and share a meal around one table.';state.englishConfirmed=false;state.dirty=true;render();toast('英語案を作成しました。内容を確認してください');return}if(a==='confirm-english'){state.englishConfirmed=true;state.dirty=true;render();toast('英語原稿を確認しました');return}if(a==='photo'){$('#photo-input').click();return}if(a==='photo-settings'){toast('写真を選択する画面を開きます');return}if(a==='new'){openDialog('体験を作成',field('体験名','newTitle','')+field('大人1名の料金（税込・円）','newAdult','6000',0,'number'),btn('下書きを作成','create',true));return}if(a==='create'){const title=$('[data-field=newTitle]').value.trim();if(!title){toast('体験名を入力してください');return}state.coffeeTitle=title;state.product='coffee';state.coffeePublished=false;state.dirty=false;state.englishConfirmed=false;state.policyAgreed=false;state.lang='ja';state.tab='page';closeDialog();navigate('editor');return}
if(a==='change-email'){openDialog('通知先を変更',field('新しい通知先メール','newNotificationEmail','',0,'email'),btn('確認メールを送る','send-email-confirm',true));return}if(a==='send-email-confirm'){const input=$('[data-field=newNotificationEmail]');if(!input.value.trim()||!input.checkValidity()){input.reportValidity();toast('メールアドレスを入力してください');return}state.pendingEmail=input.value;closeDialog();render();toast('新しい通知先の確認待ちです');return}if(a==='save-setting'){if(state.page==='seller'&&!$('#seller-consent').checked){toast('公開する情報を確認してください');return}if(state.page==='seller'){openDialog('販売者情報を公開しますか？','<p>確認した販売者情報を旅行者に公開します。</p>',btn('公開する','seller-confirm',true));return}const email=$('[data-field=email]');if(email&&!email.checkValidity()){email.reportValidity();return}toast('保存しました');shell();return}if(a==='seller-confirm'){state.sellerPublished=true;closeDialog();toast('販売者表示を公開しました');return}if(a==='seller-preview'){openDialog('販売者表示の確認','<h3>サンプルキッチン合同会社</h3><p>神奈川県サンプル市サンプル町1-2-3</p><p>contact@example.com</p><p>販売条件は各体験の予約画面に表示します。</p>');return}if(a==='stripe'){openDialog('受取口座','<span class="pill live">準備済み</span><p>サンプルキッチンの口座</p><p class="help">売上を受け取る準備ができています。</p>');return}if(a==='revoke-payout'){openDialog('口座利用の同意を取り消しますか？','<p>公開中の体験がすべて停止します。すでに確定した予約は残ります。</p>',btn('同意を取り消して停止','revoke-confirm',true));return}if(a==='revoke-confirm'){state.published=false;state.coffeePublished=false;closeDialog();toast('同意を取り消し、新しい予約受付を停止しました');return}if(a==='google'){if(state.googleConnected){openDialog('Google カレンダーの接続を切りますか？','<p>予定による空き確認が使えなくなります。新しい予約の受付状況を確認してください。</p>',btn('接続を切る','google-confirm',true))}else{state.googleConnected=true;render();toast('カレンダーを接続しました')}return}if(a==='google-confirm'){state.googleConnected=false;closeDialog();render();toast('接続を切りました');return}
if(a==='add-team'){const email=$('#team-email');if(!email.checkValidity()||!email.value.trim()){email.reportValidity();toast('メールアドレスを入力してください');return}openDialog('サブホストを追加しますか？',`<p>${esc(email.value)}</p><p>この提供者の体験・予約・予約者情報を継続して扱えるようになります。</p>`,btn('サブホストを追加','team-confirm',true));return}if(a==='team-confirm'){state.teammate=true;closeDialog();render();toast('サブホストを追加しました');return}if(a==='remove-team'){openDialog('ホストCをチームから外しますか？','<p>この提供者の体験と予約を操作できなくなります。</p>',btn('チームから外す','remove-team-confirm',true));return}if(a==='remove-team-confirm'){state.teammate=false;closeDialog();render();toast('チームから外しました');return}if(a==='support-terms'){openDialog('サポートの利用条件','<p>利用範囲と、予約受付時に適用する手数料を確認します。</p><p class="help">確定済みの予約には受付時の条件が適用されます。</p>');return}
if(a==='add-slot'){openDialog('開催枠を追加',field('開催日','slotDate','2026-11-08',0,'date')+`<div class="fields2">${field('開始時刻','slotStart','13:00',0,'time')}${field('定員','slotCapacity','6',0,'number')}</div><label class="field"><span>繰り返し</span><select><option>この日だけ</option><option>毎週 同じ曜日</option><option>毎日</option></select></label>`,btn('枠を追加','slot-confirm',true));return}if(a==='slot-confirm'){state.slotAdded=true;closeDialog();render();toast('開催枠を追加しました');return}if(a==='slot'){openDialog('11月8日（日）18:00–20:00',`<h3>${esc(state.title)}</h3><span class="pill live">${state.slotPaused?'休止中':'受付中'}</span><p>予約4名 · 定員6名</p><details><summary>掲載先の反映状況</summary><p class="help">体験サイト: 受付中<br>予約サイト: 確認中</p></details><div class="actions">${btn('この回の予約を見る','session')}${btn(state.slotPaused?'新しい予約を再開':'新しい予約を休止','pause-slot')}</div>`);return}if(a==='pause-slot'){state.slotPaused=!state.slotPaused;closeDialog();render();toast(state.slotPaused?'新しい予約を休止しました。確定済みの予約は残ります':'新しい予約を再開しました');return}
if(a==='booking'){openDialog('ゲストA の予約',`<span class="pill ${state.bookingCancelled?'':'live'}">${state.bookingCancelled?'取消済み':'確定'}</span><h3>${esc(state.title)}</h3><p>11月8日（日）18:00 · 大人2名</p><p>お支払い ¥12,000</p><details><summary>料金・精算状況</summary><p class="help">手数料 ¥1,200<br>受取額 ¥10,800</p></details><div class="actions">${link('messages','メッセージ','btn')}${link('translate','通訳を始める','btn')}${!state.bookingCancelled?btn('取り消して返金','cancel-booking'):''}</div>`);return}if(a==='cancel-booking'){openDialog('予約を取り消して返金しますか？','<p>ゲストA · 大人2名 · 11月8日18:00</p><p>¥12,000 を全額返金し、2名分の予約を取り消します。</p><label class="field"><span>理由</span><select id="cancel-reason"><option value="">選択してください</option><option>ゲストからの依頼</option><option>雨天・急病などで開催できない</option></select></label>',btn('¥12,000 を返金して取り消す','cancel-confirm',true));return}if(a==='cancel-confirm'){if(!$('#cancel-reason').value){toast('理由を選んでください');return}state.bookingCancelled=true;closeDialog();render();toast('予約を取り消し、返金を記録しました');return}if(a==='ota'){openDialog('ゲストB · GetYourGuide',`<span class="pill live">確定</span><p>11月8日（日）18:00 · 2名</p><p class="notice">取消・返金・ゲストへの連絡は GetYourGuide で行います。</p>`);return}if(a==='session'){openDialog('今日の開催 · 18:00–20:00',`<h3>${esc(state.title)}</h3><p>参加 ${state.bookingCancelled?'2':'4'}名 · 定員6名</p><div class="row" style="padding:14px 0"><span class="grow">ゲストA · 2名</span><div class="actions">${btn('来た','attended')}${btn('来なかった','absent')}</div></div><div class="actions">${link('messages','参加者に連絡','btn')}${btn('この回を中止','cancel-session')}</div>`);return}if(a==='attended'||a==='absent'){state.attendance=a;toast(a==='attended'?'「来た」を記録しました':'「来なかった」を記録しました');return}if(a==='cancel-session'){openDialog('この回を中止しますか？','<p>11月8日（日）18:00–20:00</p><p>このサイトで受けた予約1件を取り消して ¥12,000 を返金します。予約サイトの予約は各サイトで対応してください。</p><label class="field"><span>理由</span><select id="cancel-reason"><option value="">選択してください</option><option>雨天</option><option>急病</option><option>その他</option></select></label>',btn('1件を取り消して ¥12,000 を返金','cancel-confirm',true));return}
if(a==='send-reply'){openDialog('英語の返信を確認','<p>Yes, we can prepare a vegetable-based meal for you. We look forward to welcoming you.</p>',btn('この英語で送る','send-confirm',true));return}if(a==='send-confirm'){state.replySent=true;closeDialog();render();toast('返信しました');return}if(a==='review-reply'){openDialog('レビューへの返信を公開しますか？','<p>お越しいただきありがとうございました。</p>',btn('返信を公開','review-confirm',true));return}if(a==='review-confirm'){closeDialog();toast('返信を公開しました');return}if(a==='start-translation'){openDialog('対面通訳','<p>参加用のリンクを相手に共有し、相手の参加を待ちます。</p><span class="pill wait">相手の参加待ち</span>');return}if(a==='profile-english'){openDialog('ホスト紹介 · 英語の確認','<p>I share everyday life through cooking and conversation around a table.</p>',btn('この英語を確認','close',true));return}if(a==='logout'){openDialog('ログアウトしますか？','<p>次回はメールのログインリンクでログインできます。</p>',btn('ログアウト','logout-confirm',true));return}if(a==='logout-confirm'){closeDialog();toast('ログアウトの確認が完了しました');return}if(['write','niho'].includes(a)){openDialog(a==='write'?'記事を書く':'NIHO アプリ',`<p class="help">${a==='write'?'experience.niho.life/write':'niho.life'}</p>`);return}if(a==='install'){toast('アプリを追加する操作を確認しました');return}if(['previous-week','next-week','today'].includes(a)){toast('11月2–8日の開催枠を表示しています');return}}
document.addEventListener('click',e=>{const t=e.target.closest('button,a');if(!t)return;if(t.dataset.device){$('#device').classList.toggle('phone',t.dataset.device==='phone');document.querySelectorAll('[data-device]').forEach(b=>b.setAttribute('aria-pressed',String(b===t)));return}if(t.hasAttribute('data-close')){closeDialog();return}if(t.dataset.dialogGo){state.dirty=false;closeDialog();state.page=t.dataset.dialogGo;render();return}if(t.dataset.dialogSaveGo){state.dirty=false;closeDialog();state.page=t.dataset.dialogSaveGo;render();toast('保存しました');return}if(t.dataset.go){e.preventDefault();closeDialog();navigate(t.dataset.go);return}if(t.dataset.tab){state.tab=t.dataset.tab;render();return}if(t.dataset.lang){state.lang=t.dataset.lang;render();return}if(t.dataset.filter){state.filter=t.dataset.filter;render();return}if(t.dataset.action){e.preventDefault();action(t.dataset.action)}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.field&&t.dataset.field in state){state[t.dataset.field]=t.value;if(state.page==='editor'){state.dirty=true;if(state.lang==='ja'&&['title','coffeeTitle','lead','description'].includes(t.dataset.field))state.englishConfirmed=false}}});
document.addEventListener('change',e=>{const t=e.target;if(t.hasAttribute('data-consent'))state.policyAgreed=t.checked;if(t.dataset.notification)state.notifications[t.dataset.notification]=t.checked;if(t.name==='seller-mode'){state.sellerMode=t.value;$('#seller-niho').hidden=t.value!=='niho';$('#seller-own').hidden=t.value!=='own'}if(t.id==='photo-input'&&t.files[0]){const reader=new FileReader();reader.onload=()=>{const cover=$('.cover');cover.style.backgroundImage=`url(${reader.result})`;cover.style.backgroundSize='cover';cover.style.backgroundPosition='center';cover.textContent='';state.dirty=true;toast('表紙写真を選びました')};reader.readAsDataURL(t.files[0])}});
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});
render();
</script>
