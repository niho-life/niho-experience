name: Install Chromium for Playwright
description: Install Chromium and its system dependencies on the Ubuntu runner.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # Prefer Ubuntu's public mirror when the hosted runner lists both it and the Azure mirror.
        mirrors=/etc/apt/apt-mirrors.txt
        if [[ -f "$mirrors" ]] && grep -q '^https://archive\.ubuntu\.com/ubuntu/' "$mirrors"; then
          sudo sed -i '/^http:\/\/azure\.archive\.ubuntu\.com\/ubuntu\//s/priority:1/priority:4/' "$mirrors"
        fi
        npx -w @niho-experience/web playwright install --with-deps chromium
