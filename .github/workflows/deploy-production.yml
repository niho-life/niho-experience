# A reviewed main SHA is built without credentials. Only the protected production
# environment can receive an image and create a candidate Cloud Run revision.
name: Deploy production candidate

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Candidate commit SHA (40 hexadecimal characters)
        required: true
        type: string
      action:
        description: Create a no-traffic candidate, or promote an already reviewed candidate
        required: true
        type: choice
        options:
          - candidate
          - promote
        default: candidate
      enable_host_calendar:
        description: Enable NIHO host login and the experience-owned Google calendar on this revision
        required: true
        type: boolean
        default: false
      candidate_revision:
        description: Existing revision name from the successful candidate run (promote only)
        required: false
        type: string
      candidate_image_digest:
        description: Cloud Run runtime sha256 digest from the successful candidate run (promote only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && inputs.action == 'candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      IMAGE: web:${{ github.sha }}
      ARTIFACT_NAME: production-image-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      image_sha256: ${{ steps.image.outputs.sha256 }}
    steps:
      - name: Require the exact reviewed main SHA
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t "$IMAGE" .
      - name: Smoke test image
        run: sh scripts/container-smoke.sh "$IMAGE"
      - name: Save image artifact
        id: image
        run: |
          docker save --output image.tar "$IMAGE"
          echo "sha256=$(sha256sum image.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    if: inputs.action == 'candidate'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.candidate.outputs.url }}
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.PROD_GCP_PROJECT_ID }}
      REGION: ${{ vars.PROD_GCP_REGION }}
      REPOSITORY: ${{ vars.PROD_GCP_ARTIFACT_REPOSITORY }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.PROD_GCP_RUNTIME_SERVICE_ACCOUNT }}
      PREVIEW_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      SERVICE: niho-experience
      ARTIFACT_NAME: production-image-${{ github.run_id }}-${{ github.run_attempt }}
      CANDIDATE_SHA: ${{ inputs.commit_sha }}
      HOST_CALENDAR_ENABLED: ${{ inputs.enable_host_calendar }}
      # OTA watchdog (docs/ota-runtime.md). Only with the host calendar's database; unset or false keeps it closed.
      CHANNEL_WATCHDOG: ${{ vars.PROD_CHANNEL_WATCHDOG_ENABLED }}
      HOST_CALENDAR_READY: ${{ vars.PROD_HOST_CALENDAR_READY }}
      HOST_SESSION_SECRET_REF: ${{ vars.PROD_HOST_SESSION_SECRET_REF }}
      FIREBASE_WEB_API_KEY_REF: ${{ vars.PROD_NIHO_FIREBASE_WEB_API_KEY_REF }}
      DATABASE_URL_SECRET_REF: ${{ vars.PROD_EXPERIENCE_DATABASE_URL_REF }}
      GOOGLE_CLIENT_ID_SECRET_REF: ${{ vars.PROD_EXPERIENCE_GOOGLE_CLIENT_ID_REF }}
      GOOGLE_CLIENT_SECRET_REF: ${{ vars.PROD_EXPERIENCE_GOOGLE_CLIENT_SECRET_REF }}
      GOOGLE_TOKEN_KEY_SECRET_REF: ${{ vars.PROD_EXPERIENCE_GOOGLE_TOKEN_KEY_REF }}
      CLOUDSQL_INSTANCE: ${{ vars.PROD_EXPERIENCE_CLOUDSQL_INSTANCE }}
    steps:
      - name: Require protected production settings
        run: |
          test -n "$PROJECT_ID"
          test -n "$REGION"
          test -n "$REPOSITORY"
          test -n "$RUNTIME_SERVICE_ACCOUNT"
          test "$PROJECT_ID" = "niho-app-prd"
          test "$PROJECT_ID" != "$PREVIEW_PROJECT_ID"
      # Feature flags (docs/production-deploy.md「機能のフラグ」): repository variables PROD_*, resolved and checked
      # against each other before any credential exists. Only this one script is checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/deploy
      - name: Resolve feature flags before authentication
        id: flags
        env:
          DEPLOY_VARS: ${{ toJSON(vars) }}
        run: node scripts/deploy/runtime-flags.mjs --target prod --host-console "$HOST_CALENDAR_ENABLED" --site-url https://experience.niho.life
      # No checkout or repository scripts run after OIDC credentials are issued.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: .
      - name: Verify and load image artifact
        env:
          EXPECTED_IMAGE_SHA256: ${{ needs.build.outputs.image_sha256 }}
        run: |
          printf '%s  image.tar\n' "$EXPECTED_IMAGE_SHA256" | sha256sum --check --status
          docker load --input image.tar
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PROD_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.PROD_GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Push image and resolve immutable digest
        id: pushed_image
        run: |
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/web:${CANDIDATE_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker tag "web:${GITHUB_SHA}" "$image"
          push_output="$(docker push "$image" 2>&1)" || {
            printf '%s\n' "$push_output"
            exit 1
          }
          printf '%s\n' "$push_output"
          digest="$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' <<< "$push_output" | tail -n1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy candidate with sales and indexing disabled
        id: candidate
        env:
          FLAG_ENV: ${{ steps.flags.outputs.env }}
          FLAG_SECRETS: ${{ steps.flags.outputs.secrets }}
        run: |
          # The resolve step's strings: names and checked values only, never a comma inside a value.
          [[ -z "$FLAG_ENV" || "$FLAG_ENV" =~ ^[A-Z][A-Z0-9_]*=[^,]+(,[A-Z][A-Z0-9_]*=[^,]+)*$ ]]
          [[ -z "$FLAG_SECRETS" || "$FLAG_SECRETS" =~ ^[A-Z][A-Z0-9_]*=[A-Za-z0-9_-]+:[1-9][0-9]*(,[A-Z][A-Z0-9_]*=[A-Za-z0-9_-]+:[1-9][0-9]*)*$ ]]
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/web@${{ steps.pushed_image.outputs.digest }}"
          tag="candidate-${CANDIDATE_SHA}"
          tag="${tag:0:22}"
          env_vars='EXPERIENCE_API_MODE=http,EXPERIENCE_PUBLIC_API_VERSION=1.0,NEXT_PUBLIC_NIHO_WEB_ORIGIN=https://niho.life,SITE_URL=https://experience.niho.life,SITE_INDEXING=block,BOOKINGS_ENABLED=false,HOST_SIGNUP_MODE=pilot,NIHO_HOST_START_URL=https://niho.life/experiences/provider'
          runtime_options=()
          if [ "$HOST_CALENDAR_ENABLED" = true ]; then
            test "$HOST_CALENDAR_READY" = true
            for secret_ref in "$HOST_SESSION_SECRET_REF" "$FIREBASE_WEB_API_KEY_REF" "$DATABASE_URL_SECRET_REF" "$GOOGLE_CLIENT_ID_SECRET_REF" "$GOOGLE_CLIENT_SECRET_REF" "$GOOGLE_TOKEN_KEY_SECRET_REF"; do
              [[ "$secret_ref" =~ ^[A-Za-z0-9_-]+:[1-9][0-9]*$ ]]
            done
            [[ "$CLOUDSQL_INSTANCE" =~ ^[a-z0-9-]+:[a-z0-9-]+:[a-z0-9-]+$ ]]
            test "${CLOUDSQL_INSTANCE%%:*}" = "$PROJECT_ID"
            env_vars+=",HOST_CONSOLE_ENABLED=true${FLAG_ENV:+,$FLAG_ENV}"
            if [ "$CHANNEL_WATCHDOG" = true ]; then
              env_vars+=",EXPERIENCE_CHANNEL_WATCHDOG_ENABLED=true,EXPERIENCE_CHANNEL_WATCHDOG_AUDIENCE=https://experience.niho.life,EXPERIENCE_CHANNEL_WATCHDOG_SERVICE_ACCOUNT_EMAIL=experience-ota-watchdog@${PROJECT_ID}.iam.gserviceaccount.com"
            else
              [[ -z "$CHANNEL_WATCHDOG" || "$CHANNEL_WATCHDOG" = false ]]
            fi
            runtime_options+=(--network default --subnet default --vpc-egress private-ranges-only)
            runtime_options+=(--add-cloudsql-instances "$CLOUDSQL_INSTANCE")
            runtime_options+=(--set-secrets "HOST_SESSION_SECRET=${HOST_SESSION_SECRET_REF},NIHO_FIREBASE_WEB_API_KEY=${FIREBASE_WEB_API_KEY_REF},EXPERIENCE_DATABASE_URL=${DATABASE_URL_SECRET_REF},EXPERIENCE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID_SECRET_REF},EXPERIENCE_GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET_REF},EXPERIENCE_GOOGLE_TOKEN_KEY=${GOOGLE_TOKEN_KEY_SECRET_REF}${FLAG_SECRETS:+,$FLAG_SECRETS}")
          else
            env_vars+=',HOST_CONSOLE_ENABLED=false'
            # Every flag needs the host console and its database (the resolve step refused any otherwise).
            test -z "$FLAG_ENV" && test -z "$FLAG_SECRETS"
            runtime_options+=(--clear-secrets --clear-cloudsql-instances --clear-network)
            # The watchdog needs the Experience database, which only the host calendar wires.
            [[ -z "$CHANNEL_WATCHDOG" || "$CHANNEL_WATCHDOG" = false ]]
          fi
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --image "$image" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --no-invoker-iam-check --port 8080 --cpu 1 --memory 512Mi \
            --min-instances 0 --max-instances 2 --no-traffic --tag "$tag" \
            --set-env-vars "$env_vars" "${runtime_options[@]}" \
            --labels "app=niho-experience,env=production,commit=${GITHUB_SHA:0:12}" --quiet
          state="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          revision="$(jq -r '.status.latestReadyRevisionName' <<< "$state")"
          url="$(jq -r --arg tag "$tag" '.status.traffic[] | select(.tag == $tag) | .url' <<< "$state")"
          tagged_revision="$(jq -r --arg tag "$tag" '.status.traffic[] | select(.tag == $tag) | .revisionName' <<< "$state")"
          test -n "$revision" && test -n "$url" && test "$revision" = "$tagged_revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "revision=${revision}"
            echo "pushed_image_digest=${{ steps.pushed_image.outputs.digest }}"
            echo "candidate_url=${url}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check isolated candidate
        env:
          URL: ${{ steps.candidate.outputs.url }}
          REVISION: ${{ steps.candidate.outputs.revision }}
          FLAG_NAMES: ${{ steps.flags.outputs.names }}
          FLAG_EXPECTED_ENV: ${{ steps.flags.outputs.expected_env }}
          FLAG_EXPECTED_SECRETS: ${{ steps.flags.outputs.expected_secrets }}
          FLAG_SUMMARY: ${{ steps.flags.outputs.summary }}
        run: |
          curl -fsS --retry 5 --retry-all-errors 'https://niho.life/api/public/experiences' \
            | jq -e '.experiences | type == "array"' >/dev/null
          revision_json="$(gcloud run revisions describe "$REVISION" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          image_repo="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/web"
          pushed_digest="${{ steps.pushed_image.outputs.digest }}"
          runtime_image="$(jq -r '.spec.containers[0].image' <<< "$revision_json")"
          [[ "$runtime_image" == "${image_repo}@sha256:"* ]]
          runtime_digest="${runtime_image##*@}"
          [[ "$runtime_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [ "$runtime_digest" != "$pushed_digest" ]; then
            # Cloud Run pins the platform image while Docker may push an OCI index.
            manifest="$(curl -fsS --retry 3 --retry-all-errors \
              -H "Authorization: Bearer $(gcloud auth print-access-token)" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://${REGION}-docker.pkg.dev/v2/${PROJECT_ID}/${REPOSITORY}/web/manifests/${pushed_digest}")"
            jq -e --arg digest "$runtime_digest" '
              (.mediaType == "application/vnd.oci.image.index.v1+json" or
               .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json") and
              ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] |
               length == 1 and .[0].digest == $digest)
            ' <<< "$manifest" >/dev/null
          fi
          test "$(jq -r '.spec.containers[0].env[] | select(.name == "EXPERIENCE_API_MODE") | .value' <<< "$revision_json")" = http
          test "$(jq -r '.spec.containers[0].env[] | select(.name == "EXPERIENCE_PUBLIC_API_VERSION") | .value' <<< "$revision_json")" = 1.0
          test "$(jq -r '.spec.containers[0].env[] | select(.name == "BOOKINGS_ENABLED") | .value' <<< "$revision_json")" = false
          test "$(jq -r '.spec.containers[0].env[] | select(.name == "SITE_INDEXING") | .value' <<< "$revision_json")" = block
          test "$(jq -r '.spec.containers[0].env[] | select(.name == "HOST_SIGNUP_MODE") | .value' <<< "$revision_json")" = pilot
          test "$(jq -r '.spec.containers[0].env[] | select(.name == "NIHO_HOST_START_URL") | .value' <<< "$revision_json")" = https://niho.life/experiences/provider
          test "$(jq -r '.spec.containers[0].env[] | select(.name == "SITE_URL") | .value' <<< "$revision_json")" = https://experience.niho.life
          test "$(jq -r '.spec.containers[0].env[] | select(.name == "NEXT_PUBLIC_NIHO_WEB_ORIGIN") | .value' <<< "$revision_json")" = https://niho.life
          test "$(jq -r '.spec.containers[0].env[] | select(.name == "HOST_CONSOLE_ENABLED") | .value' <<< "$revision_json")" = "$HOST_CALENDAR_ENABLED"
          expected_watchdog=false
          if [ "$HOST_CALENDAR_ENABLED" = true ] && [ "$CHANNEL_WATCHDOG" = true ]; then expected_watchdog=true; fi
          test "$(jq -r '[.spec.containers[0].env[] | select(.name == "EXPERIENCE_CHANNEL_WATCHDOG_ENABLED") | .value][0] // "false"' <<< "$revision_json")" = "$expected_watchdog"
          # Feature flags: exactly the values and Secret references the resolve step expects, and no other name of its table.
          jq -e --argjson names "$FLAG_NAMES" --argjson env "$FLAG_EXPECTED_ENV" --argjson secrets "$FLAG_EXPECTED_SECRETS" '
            [.spec.containers[0].env[] | select(.name as $name | any($names[]; . == $name))] as $set |
            ($set | map(select(has("value")) | {key: .name, value: .value}) | from_entries) == $env and
            ($set | map(select(has("valueFrom")) | {key: .name, value: (.valueFrom.secretKeyRef.name + ":" + .valueFrom.secretKeyRef.key)}) | from_entries) == $secrets
          ' <<< "$revision_json" >/dev/null
          if [ "$HOST_CALENDAR_ENABLED" = true ]; then
            jq -e '[.spec.containers[0].env[] | select(.name == "HOST_SESSION_SECRET" or .name == "NIHO_FIREBASE_WEB_API_KEY" or .name == "EXPERIENCE_DATABASE_URL" or .name == "EXPERIENCE_GOOGLE_CLIENT_ID" or .name == "EXPERIENCE_GOOGLE_CLIENT_SECRET" or .name == "EXPERIENCE_GOOGLE_TOKEN_KEY") | select(.valueFrom.secretKeyRef != null)] | length == 6' <<< "$revision_json" >/dev/null
            jq -e --arg sql "$CLOUDSQL_INSTANCE" '
              .metadata.annotations["run.googleapis.com/cloudsql-instances"] == $sql and
              .metadata.annotations["run.googleapis.com/vpc-access-egress"] == "private-ranges-only" and
              (.metadata.annotations["run.googleapis.com/network-interfaces"] | fromjson | any(.[]; .network == "default" and .subnetwork == "default"))
            ' <<< "$revision_json" >/dev/null
            curl -fsSL -o /dev/null "${URL}/host/calendar"
          else
            jq -e '(.metadata.annotations["run.googleapis.com/cloudsql-instances"] // "") == "" and .metadata.annotations["run.googleapis.com/network-interfaces"] == null' <<< "$revision_json" >/dev/null
            test "$(curl -sS -o /dev/null -w '%{http_code}' "${URL}/host/calendar")" = 404
          fi
          for path in / /experiences /host; do
            curl -fsS -o /dev/null --retry 5 --retry-all-errors "${URL}${path}"
            echo "ok   ${path}"
          done
          host_page="$(curl -fsS --retry 5 --retry-all-errors "${URL}/host")"
          if [ "$HOST_CALENDAR_ENABLED" = true ]; then
            grep -qF 'href="/host/auth/login"' <<< "$host_page"
          else
            grep -qF 'href="https://niho.life/experiences/provider"' <<< "$host_page"
          fi
          page="$(curl -fsS "${URL}/experiences")"
          if grep -qF 'Preview with sample data' <<< "$page"; then exit 1; fi
          if grep -qF 'Details to be confirmed' <<< "$page"; then exit 1; fi
          curl -fsS "${URL}/robots.txt" | grep -qF 'Disallow: /'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "${URL}/preview/states")" = 404
          test "$(curl -sS -o /dev/null -w '%{http_code}' "${URL}/preview/checkout")" = 404
          {
            echo "Candidate: ${REVISION} ${URL}"
            echo "Runtime image digest (candidate_image_digest): ${runtime_digest}"
            echo "Pushed image digest: ${pushed_digest}"
            echo "Commit: ${GITHUB_SHA}; bookings=false; indexing=block; host signup=pilot; host calendar=${HOST_CALENDAR_ENABLED}"
            echo "Feature flags: ${FLAG_SUMMARY}"
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && inputs.action == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.PROD_GCP_PROJECT_ID }}
      REGION: ${{ vars.PROD_GCP_REGION }}
      REPOSITORY: ${{ vars.PROD_GCP_ARTIFACT_REPOSITORY }}
      PREVIEW_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      SERVICE: niho-experience
      CANDIDATE_SHA: ${{ inputs.commit_sha }}
      CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
      CANDIDATE_IMAGE_DIGEST: ${{ inputs.candidate_image_digest }}
      HOST_CALENDAR_ENABLED: ${{ inputs.enable_host_calendar }}
      # OTA watchdog (docs/ota-runtime.md). Only with the host calendar's database; unset or false keeps it closed.
      CHANNEL_WATCHDOG: ${{ vars.PROD_CHANNEL_WATCHDOG_ENABLED }}
      HOST_CALENDAR_READY: ${{ vars.PROD_HOST_CALENDAR_READY }}
      CLOUDSQL_INSTANCE: ${{ vars.PROD_EXPERIENCE_CLOUDSQL_INSTANCE }}
    steps:
      - name: Validate the selected candidate and protected settings
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_REVISION" =~ ^${SERVICE}-[a-z0-9-]+$ ]]
          [[ "$CANDIDATE_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test -n "$PROJECT_ID"
          test -n "$REGION"
          test -n "$REPOSITORY"
          test "$PROJECT_ID" = "niho-app-prd"
          test "$PROJECT_ID" != "$PREVIEW_PROJECT_ID"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require the candidate commit to remain on main
        run: git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
      # The same PROD_* variables as the candidate: changing one after it was made stops the promotion below.
      - name: Resolve feature flags before authentication
        id: flags
        env:
          DEPLOY_VARS: ${{ toJSON(vars) }}
        run: node scripts/deploy/runtime-flags.mjs --target prod --host-console "$HOST_CALENDAR_ENABLED" --site-url https://experience.niho.life
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PROD_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.PROD_GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Verify and recheck the existing candidate
        id: candidate
        env:
          FLAG_NAMES: ${{ steps.flags.outputs.names }}
          FLAG_EXPECTED_ENV: ${{ steps.flags.outputs.expected_env }}
          FLAG_EXPECTED_SECRETS: ${{ steps.flags.outputs.expected_secrets }}
          FLAG_SUMMARY: ${{ steps.flags.outputs.summary }}
        run: |
          revision_json="$(gcloud run revisions describe "$CANDIDATE_REVISION" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          expected_image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/web@${CANDIDATE_IMAGE_DIGEST}"
          test "$(jq -r '.spec.containers[0].image' <<< "$revision_json")" = "$expected_image"
          test "$(jq -r '.metadata.labels.commit' <<< "$revision_json")" = "${CANDIDATE_SHA:0:12}"
          jq -e '.status.conditions[] | select(.type == "Ready" and .status == "True")' <<< "$revision_json" >/dev/null
          test "$(jq -r '.spec.containers[0].env[] | select(.name == "BOOKINGS_ENABLED") | .value' <<< "$revision_json")" = false
          test "$(jq -r '.spec.containers[0].env[] | select(.name == "SITE_INDEXING") | .value' <<< "$revision_json")" = block
          test "$(jq -r '.spec.containers[0].env[] | select(.name == "HOST_SIGNUP_MODE") | .value' <<< "$revision_json")" = pilot
          test "$(jq -r '.spec.containers[0].env[] | select(.name == "NIHO_HOST_START_URL") | .value' <<< "$revision_json")" = https://niho.life/experiences/provider
          test "$(jq -r '.spec.containers[0].env[] | select(.name == "SITE_URL") | .value' <<< "$revision_json")" = https://experience.niho.life
          test "$(jq -r '.spec.containers[0].env[] | select(.name == "NEXT_PUBLIC_NIHO_WEB_ORIGIN") | .value' <<< "$revision_json")" = https://niho.life
          test "$(jq -r '.spec.containers[0].env[] | select(.name == "EXPERIENCE_API_MODE") | .value' <<< "$revision_json")" = http
          test "$(jq -r '.spec.containers[0].env[] | select(.name == "EXPERIENCE_PUBLIC_API_VERSION") | .value' <<< "$revision_json")" = 1.0
          test "$(jq -r '.spec.containers[0].env[] | select(.name == "HOST_CONSOLE_ENABLED") | .value' <<< "$revision_json")" = "$HOST_CALENDAR_ENABLED"
          expected_watchdog=false
          if [ "$HOST_CALENDAR_ENABLED" = true ] && [ "$CHANNEL_WATCHDOG" = true ]; then expected_watchdog=true; fi
          test "$(jq -r '[.spec.containers[0].env[] | select(.name == "EXPERIENCE_CHANNEL_WATCHDOG_ENABLED") | .value][0] // "false"' <<< "$revision_json")" = "$expected_watchdog"
          # Feature flags: exactly the values and Secret references the resolve step expects, and no other name of its table.
          jq -e --argjson names "$FLAG_NAMES" --argjson env "$FLAG_EXPECTED_ENV" --argjson secrets "$FLAG_EXPECTED_SECRETS" '
            [.spec.containers[0].env[] | select(.name as $name | any($names[]; . == $name))] as $set |
            ($set | map(select(has("value")) | {key: .name, value: .value}) | from_entries) == $env and
            ($set | map(select(has("valueFrom")) | {key: .name, value: (.valueFrom.secretKeyRef.name + ":" + .valueFrom.secretKeyRef.key)}) | from_entries) == $secrets
          ' <<< "$revision_json" >/dev/null
          if [ "$HOST_CALENDAR_ENABLED" = true ]; then
            test "$HOST_CALENDAR_READY" = true
            jq -e '[.spec.containers[0].env[] | select(.name == "HOST_SESSION_SECRET" or .name == "NIHO_FIREBASE_WEB_API_KEY" or .name == "EXPERIENCE_DATABASE_URL" or .name == "EXPERIENCE_GOOGLE_CLIENT_ID" or .name == "EXPERIENCE_GOOGLE_CLIENT_SECRET" or .name == "EXPERIENCE_GOOGLE_TOKEN_KEY") | select(.valueFrom.secretKeyRef != null)] | length == 6' <<< "$revision_json" >/dev/null
            jq -e --arg sql "$CLOUDSQL_INSTANCE" '
              .metadata.annotations["run.googleapis.com/cloudsql-instances"] == $sql and
              .metadata.annotations["run.googleapis.com/vpc-access-egress"] == "private-ranges-only" and
              (.metadata.annotations["run.googleapis.com/network-interfaces"] | fromjson | any(.[]; .network == "default" and .subnetwork == "default"))
            ' <<< "$revision_json" >/dev/null
          else
            jq -e '(.metadata.annotations["run.googleapis.com/cloudsql-instances"] // "") == "" and .metadata.annotations["run.googleapis.com/network-interfaces"] == null' <<< "$revision_json" >/dev/null
          fi
          state="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          tag="candidate-${CANDIDATE_SHA}"
          tag="${tag:0:22}"
          url="$(jq -r --arg tag "$tag" --arg revision "$CANDIDATE_REVISION" '.status.traffic[] | select(.tag == $tag and .revisionName == $revision) | .url' <<< "$state")"
          test -n "$url" && test "$url" != null
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "Verified existing revision: ${CANDIDATE_REVISION}"
            echo "Verified image digest: ${CANDIDATE_IMAGE_DIGEST}"
            echo "Candidate URL: ${url}"
            echo "Feature flags: ${FLAG_SUMMARY}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check candidate URL before promotion
        env:
          URL: ${{ steps.candidate.outputs.url }}
        run: |
          curl -fsS --retry 5 --retry-all-errors 'https://niho.life/api/public/experiences' \
            | jq -e '.experiences | type == "array"' >/dev/null
          for path in / /experiences /host; do
            curl -fsS -o /dev/null --retry 5 --retry-all-errors "${URL}${path}"
          done
          host_page="$(curl -fsS --retry 5 --retry-all-errors "${URL}/host")"
          if [ "$HOST_CALENDAR_ENABLED" = true ]; then
            grep -qF 'href="/host/auth/login"' <<< "$host_page"
            curl -fsSL -o /dev/null "${URL}/host/calendar"
          else
            grep -qF 'href="https://niho.life/experiences/provider"' <<< "$host_page"
            test "$(curl -sS -o /dev/null -w '%{http_code}' "${URL}/host/calendar")" = 404
          fi
          page="$(curl -fsS "${URL}/experiences")"
          if grep -qF 'Preview with sample data' <<< "$page"; then exit 1; fi
          if grep -qF 'Details to be confirmed' <<< "$page"; then exit 1; fi
          curl -fsS "${URL}/robots.txt" | grep -qF 'Disallow: /'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "${URL}/preview/states")" = 404
          test "$(curl -sS -o /dev/null -w '%{http_code}' "${URL}/preview/checkout")" = 404
      - name: Promote the reviewed existing revision
        run: |
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --to-revisions "${CANDIDATE_REVISION}=100" --quiet
          state="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          jq -e --arg revision "$CANDIDATE_REVISION" '[.status.traffic[] | select(.revisionName == $revision and .percent == 100)] | length == 1' <<< "$state" >/dev/null
          echo "Serving reviewed revision: ${CANDIDATE_REVISION} (100%)" >> "$GITHUB_STEP_SUMMARY"
