# Manual, reviewed main only. Build has no deployment credentials.
name: Deploy host staging

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Reviewed main commit (40 lowercase hexadecimal characters)
        required: true
        type: string
      action:
        description: Create a candidate or promote an accepted candidate
        type: choice
        required: true
        options: [candidate, promote]
        default: candidate
      candidate_revision:
        description: Revision from the successful candidate run (promote only)
        type: string
      candidate_image_digest:
        description: Cloud Run runtime image digest from the successful candidate run (promote only)
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-host-staging
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      owner_bypass: ${{ steps.actor.outputs.owner_bypass }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select owner-only staging environment
        id: actor
        run: |
          if bash scripts/check-production-owner.sh >/dev/null 2>&1; then
            echo 'owner_bypass=true' >> "$GITHUB_OUTPUT"
          else
            echo 'owner_bypass=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Require explicitly enabled main deployment
        env:
          ENABLED: ${{ vars.STG_HOST_DEPLOY_ENABLED }}
          SHA: ${{ inputs.commit_sha }}
          ACTION: ${{ inputs.action }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$ENABLED" = true
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ "$ACTION" = candidate ]; then test "$SHA" = "$GITHUB_SHA"; fi

  build:
    needs: validate
    if: inputs.action == 'candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: host-staging:${{ github.sha }}
    outputs:
      archive_sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and smoke with staging CSP
        run: |
          docker build --build-arg NIHO_WEB_CSP_ORIGIN=https://app-stg.niho.life -t "$IMAGE" .
          sh scripts/container-smoke.sh "$IMAGE" https://app-stg.niho.life
      - name: Save image without credentials
        id: archive
        run: |
          docker save --output image.tar "$IMAGE"
          echo "sha256=$(sha256sum image.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    needs: [validate, build]
    if: always() && needs.validate.result == 'success' && (needs.build.result == 'success' || (inputs.action == 'promote' && needs.build.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ needs.validate.outputs.owner_bypass == 'true' && 'host-staging-owner' || 'host-staging' }}
      url: ${{ vars.STG_HOST_SERVICE_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: niho-app-stg
      REGION: asia-northeast1
      SERVICE: niho-experience-host-stg
      CANDIDATE_TAG_PREFIX: cand-
      LEGACY_CANDIDATE_TAG_PREFIX: candidate-
      REPOSITORY: experience-host-stg
      RUNTIME: experience-host-stg-runtime@niho-app-stg.iam.gserviceaccount.com
      ACTION: ${{ inputs.action }}
      SHA: ${{ inputs.commit_sha }}
      REVISION: ${{ inputs.candidate_revision }}
      DIGEST: ${{ inputs.candidate_image_digest }}
      SITE_URL: ${{ vars.STG_HOST_SERVICE_URL }}
      CORE_READY: ${{ vars.STG_HOST_CORE_READY }}
      CLOUDSQL: ${{ vars.STG_HOST_CLOUDSQL_INSTANCE }}
      SESSION_REF: ${{ vars.STG_HOST_SESSION_SECRET_REF }}
      FIREBASE_REF: ${{ vars.STG_HOST_FIREBASE_WEB_API_KEY_REF }}
      DATABASE_REF: ${{ vars.STG_HOST_DATABASE_URL_REF }}
      GOOGLE_ID_REF: ${{ vars.STG_HOST_GOOGLE_CLIENT_ID_REF }}
      GOOGLE_SECRET_REF: ${{ vars.STG_HOST_GOOGLE_CLIENT_SECRET_REF }}
      GOOGLE_KEY_REF: ${{ vars.STG_HOST_GOOGLE_TOKEN_KEY_REF }}
      # Traveler booking with Stripe TEST mode (#285, docs/host-calendar-staging.md): BOOKINGS_ENABLED follows it.
      # It and the other feature flags (STG_*, with their settings and NIHO app's existing staging secrets) are
      # resolved by scripts/deploy/runtime-flags.mjs below; unset or false keeps each off.
      GUEST_BOOKING: ${{ vars.STG_GUEST_BOOKING_ENABLED }}
    steps:
      - name: Require protected readiness and numeric staging secret versions
        env:
          DEPLOYER: ${{ vars.STG_HOST_DEPLOY_SERVICE_ACCOUNT }}
          WIF: ${{ vars.STG_HOST_WIF_PROVIDER }}
        run: |
          test "$CORE_READY" = true
          test "$DEPLOYER" = experience-host-stg-deployer@niho-app-stg.iam.gserviceaccount.com
          [[ "$WIF" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/experience-host-staging/providers/github$ ]]
          test "$SITE_URL" = https://experience-stg.niho.life
          test "$CLOUDSQL" = niho-app-stg:asia-northeast1:niho-app-db-stg
          [[ "$SESSION_REF" =~ ^experience-stg-host-session:[1-9][0-9]*$ ]]
          [[ "$FIREBASE_REF" =~ ^experience-stg-niho-firebase-web-api-key:[1-9][0-9]*$ ]]
          [[ "$DATABASE_REF" =~ ^experience-stg-database-url:[1-9][0-9]*$ ]]
          [[ "$GOOGLE_ID_REF" =~ ^experience-stg-google-client-id:[1-9][0-9]*$ ]]
          [[ "$GOOGLE_SECRET_REF" =~ ^experience-stg-google-client-secret:[1-9][0-9]*$ ]]
          [[ "$GOOGLE_KEY_REF" =~ ^experience-stg-google-token-key:[1-9][0-9]*$ ]]
          [[ -z "$GUEST_BOOKING" || "$GUEST_BOOKING" =~ ^(true|false)$ ]]
          if [ "$ACTION" = promote ]; then
            [[ "$REVISION" =~ ^niho-experience-host-stg-[a-z0-9-]+$ ]]
            [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Recheck owner identity before Google credentials
        if: needs.validate.outputs.owner_bypass == 'true'
        run: bash scripts/check-production-owner.sh
      - name: Require reviewed commit on main
        run: git merge-base --is-ancestor "$SHA" origin/main
      # Feature flags (docs/host-calendar-staging.md「機能のフラグ」): each needs every setting, Secret reference and
      # flag it depends on, checked before any credential exists. Changing one after the candidate stops promotion.
      - name: Resolve feature flags before authentication
        id: flags
        env:
          DEPLOY_VARS: ${{ toJSON(vars) }}
        run: node scripts/deploy/runtime-flags.mjs --target stg --host-console true --site-url "$SITE_URL"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: inputs.action == 'candidate'
        with:
          name: host-staging-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify and load image before authentication
        if: inputs.action == 'candidate'
        env:
          ARCHIVE_SHA: ${{ needs.build.outputs.archive_sha256 }}
        run: |
          printf '%s  image.tar\n' "$ARCHIVE_SHA" | sha256sum --check --status
          docker load --input image.tar
      - name: Validate candidate tag length before authentication
        id: candidate_tag
        if: inputs.action == 'candidate'
        run: |
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          tag="${CANDIDATE_TAG_PREFIX}${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$tag" =~ ^[a-z][a-z0-9-]*[a-z0-9]$ ]]
          if (( ${#SERVICE} + ${#tag} > 46 )); then
            printf 'Cloud Run service+tag length exceeds 46 characters (service=%s, tag=%s).\n' "${#SERVICE}" "${#tag}" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      # No repository scripts, builds or containers execute after authentication.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: deploy_auth
        with:
          workload_identity_provider: ${{ vars.STG_HOST_WIF_PROVIDER }}
          service_account: ${{ vars.STG_HOST_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Create or verify isolated candidate
        id: candidate
        env:
          FLAG_ENV: ${{ steps.flags.outputs.env }}
          FLAG_SECRETS: ${{ steps.flags.outputs.secrets }}
          FLAG_EXPECTED_ENV: ${{ steps.flags.outputs.expected_env }}
          FLAG_EXPECTED_SECRETS: ${{ steps.flags.outputs.expected_secrets }}
          FLAG_SUMMARY: ${{ steps.flags.outputs.summary }}
          CANDIDATE_TAG: ${{ steps.candidate_tag.outputs.tag }}
        run: |
          # The resolve step's strings: names and checked values only, never a comma inside a value.
          [[ -z "$FLAG_ENV" || "$FLAG_ENV" =~ ^[A-Z][A-Z0-9_]*=[^,]+(,[A-Z][A-Z0-9_]*=[^,]+)*$ ]]
          [[ -z "$FLAG_SECRETS" || "$FLAG_SECRETS" =~ ^[A-Z][A-Z0-9_]*=[A-Za-z0-9_-]+:[1-9][0-9]*(,[A-Z][A-Z0-9_]*=[A-Za-z0-9_-]+:[1-9][0-9]*)*$ ]]
          bookings=false
          if [ "$GUEST_BOOKING" = true ]; then bookings=true; fi
          state="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json)"
          test "$(jq -r '.metadata.name' <<< "$state")" = niho-experience-host-stg
          test "$(jq -r '.metadata.labels.app' <<< "$state")" = niho-experience
          test "$(jq -r '.metadata.labels.env' <<< "$state")" = host-staging
          traffic="$(jq -c '[.status.traffic[] | select((.percent // 0) > 0) | {revisionName,percent}] | sort_by(.revisionName)' <<< "$state")"
          jq -e 'length > 0 and (map(.percent) | add) == 100 and all(.[]; .revisionName != null)' <<< "$traffic" >/dev/null
          if [ "$ACTION" = candidate ]; then
            image="${REGION}-docker.pkg.dev/${PROJECT}/${REPOSITORY}/web:${SHA}"
            gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
            docker tag "host-staging:${SHA}" "$image"
            push_output="$(docker push "$image" 2>&1)" || { printf '%s\n' "$push_output"; exit 1; }
            PUSHED_DIGEST="$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' <<< "$push_output" | tail -n1)"
            [[ "$PUSHED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            gcloud run deploy "$SERVICE" --project "$PROJECT" --region "$REGION" \
              --image "${REGION}-docker.pkg.dev/${PROJECT}/${REPOSITORY}/web@${PUSHED_DIGEST}" \
              --service-account "$RUNTIME" --execution-environment gen2 \
              --port 8080 --cpu 1 --memory 512Mi --min-instances 0 --max-instances 2 \
              --no-traffic --tag "$CANDIDATE_TAG" --ingress internal-and-cloud-load-balancing \
              --network default --subnet default --vpc-egress private-ranges-only \
              --set-cloudsql-instances "$CLOUDSQL" \
              --set-env-vars "EXPERIENCE_API_MODE=http,EXPERIENCE_PUBLIC_API_VERSION=1.0,NEXT_PUBLIC_NIHO_WEB_ORIGIN=https://app-stg.niho.life,SITE_URL=${SITE_URL},SITE_INDEXING=block,BOOKINGS_ENABLED=${bookings},HOST_SIGNUP_MODE=pilot,HOST_CONSOLE_ENABLED=true,NIHO_HOST_START_URL=https://app-stg.niho.life/experiences/provider,GUIDE_EDITOR_SITE_ORIGIN=https://editor.niho.life,DEPLOY_COMMIT_SHA=${SHA}${FLAG_ENV:+,$FLAG_ENV}" \
              --set-secrets "HOST_SESSION_SECRET=${SESSION_REF},NIHO_FIREBASE_WEB_API_KEY=${FIREBASE_REF},EXPERIENCE_DATABASE_URL=${DATABASE_REF},EXPERIENCE_GOOGLE_CLIENT_ID=${GOOGLE_ID_REF},EXPERIENCE_GOOGLE_CLIENT_SECRET=${GOOGLE_SECRET_REF},EXPERIENCE_GOOGLE_TOKEN_KEY=${GOOGLE_KEY_REF}${FLAG_SECRETS:+,$FLAG_SECRETS}" \
              --labels "app=niho-experience,env=host-staging,commit=${SHA:0:12}" --quiet
            REVISION=""
            url=""
            after=""
            for attempt in {1..10}; do
              state="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json)"
              resolved_revision="$(jq -r --arg tag "$CANDIDATE_TAG" --arg short "$CANDIDATE_TAG_PREFIX" --arg legacy "$LEGACY_CANDIDATE_TAG_PREFIX" '
                def is_candidate_tag($short; $legacy): . as $tag | ($tag | startswith($short)) or ($tag | startswith($legacy));
                [.status.traffic[] | select(.tag == $tag and (.tag | is_candidate_tag($short; $legacy))) | .revisionName] | unique | if length == 1 then .[0] else empty end
              ' <<< "$state")"
              after="$(jq -c '[.status.traffic[] | select((.percent // 0) > 0) | {revisionName,percent}] | sort_by(.revisionName)' <<< "$state")"
              url="$(jq -r --arg revision "$resolved_revision" '[.status.traffic[] | select(.revisionName == $revision and .url != null) | .url][0] // empty' <<< "$state")"
              if [[ -n "$resolved_revision" && "$traffic" = "$after" && "$url" =~ ^https://[a-z0-9-]+\.a\.run\.app$ ]]; then
                REVISION="$resolved_revision"
                break
              fi
              if [ "$attempt" -lt 10 ]; then sleep 3; fi
            done
            if [ -z "$REVISION" ]; then
              printf '::error::Candidate readback did not converge after 30 seconds (tag=%s, resolved_revision=%s, stable_traffic_before=%s, stable_traffic_after=%s, url=%s).\n' \
                "$CANDIDATE_TAG" "$resolved_revision" "$traffic" "$after" "$url" >&2
              exit 1
            fi
          fi
          revision="$(gcloud run revisions describe "$REVISION" --project "$PROJECT" --region "$REGION" --format=json)"
          image_repo="${REGION}-docker.pkg.dev/${PROJECT}/${REPOSITORY}/web"
          runtime_image="$(jq -er '.spec.containers[0].image' <<< "$revision")"
          resolved_image="$(jq -er '.status.imageDigest' <<< "$revision")"
          runtime_digest="${runtime_image##*@}"
          if [[ "$runtime_image" != "${image_repo}@sha256:"* || ! "$runtime_digest" =~ ^sha256:[0-9a-f]{64}$ || "$resolved_image" != "$runtime_image" ]]; then
            printf '::error::Revision %s does not report a pinned runtime image digest (image=%s, resolved=%s).\n' \
              "$REVISION" "$runtime_image" "$resolved_image" >&2
            exit 1
          fi
          if [ "$ACTION" = candidate ]; then
            if [ "$runtime_digest" != "$PUSHED_DIGEST" ]; then
              # Cloud Run pins the platform image while Docker may push an OCI index.
              manifest="$(curl -fsS --retry 3 --retry-all-errors \
                -H "Authorization: Bearer $(gcloud auth print-access-token)" \
                -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
                "https://${REGION}-docker.pkg.dev/v2/${PROJECT}/${REPOSITORY}/web/manifests/${PUSHED_DIGEST}")"
              if ! jq -e --arg digest "$runtime_digest" '
                (.mediaType == "application/vnd.oci.image.index.v1+json" or
                 .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json") and
                ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] |
                 length == 1 and .[0].digest == $digest)
              ' <<< "$manifest" >/dev/null; then
                printf '::error::Revision runtime digest %s is not the unique linux/amd64 child of pushed digest %s.\n' \
                  "$runtime_digest" "$PUSHED_DIGEST" >&2
                exit 1
              fi
            fi
            # Promotion consumes Cloud Run's resolved runtime digest, not a possible OCI index digest.
            DIGEST="$runtime_digest"
          else
            expected_image="${image_repo}@${DIGEST}"
            if [[ "$runtime_image" != "$expected_image" || "$resolved_image" != "$expected_image" ]]; then
              printf '::error::Revision %s image does not match the candidate runtime digest (expected=%s, image=%s, resolved=%s).\n' \
                "$REVISION" "$expected_image" "$runtime_image" "$resolved_image" >&2
              exit 1
            fi
          fi
          if ! jq -e --arg runtime "$RUNTIME" --arg sql "$CLOUDSQL" '
            .spec.serviceAccountName == $runtime and
            .metadata.annotations["run.googleapis.com/cloudsql-instances"] == $sql and
            .metadata.annotations["run.googleapis.com/vpc-access-egress"] == "private-ranges-only" and
            (.metadata.annotations["run.googleapis.com/network-interfaces"] | fromjson | any(.[]; .network == "default" and .subnetwork == "default")) and
            any(.status.conditions[]; .type == "Ready" and .status == "True")' <<< "$revision" >/dev/null; then
            printf '::error::Revision %s failed image, runtime identity, Cloud SQL, VPC or Ready readback.\n' "$REVISION" >&2
            exit 1
          fi
          # The fixed settings, and exactly what the resolve step expects of the feature flags.
          expected_env="$(jq -cn --arg origin "$SITE_URL" --arg sha "$SHA" --arg bookings "$bookings" --argjson flags "$FLAG_EXPECTED_ENV" '{EXPERIENCE_API_MODE:"http",EXPERIENCE_PUBLIC_API_VERSION:"1.0",NEXT_PUBLIC_NIHO_WEB_ORIGIN:"https://app-stg.niho.life",SITE_URL:$origin,SITE_INDEXING:"block",BOOKINGS_ENABLED:$bookings,HOST_SIGNUP_MODE:"pilot",HOST_CONSOLE_ENABLED:"true",NIHO_HOST_START_URL:"https://app-stg.niho.life/experiences/provider",GUIDE_EDITOR_SITE_ORIGIN:"https://editor.niho.life",DEPLOY_COMMIT_SHA:$sha} + $flags')"
          expected_secrets="$(jq -cn --arg a "$SESSION_REF" --arg b "$FIREBASE_REF" --arg c "$DATABASE_REF" --arg d "$GOOGLE_ID_REF" --arg e "$GOOGLE_SECRET_REF" --arg f "$GOOGLE_KEY_REF" --argjson flags "$FLAG_EXPECTED_SECRETS" '{HOST_SESSION_SECRET:$a,NIHO_FIREBASE_WEB_API_KEY:$b,EXPERIENCE_DATABASE_URL:$c,EXPERIENCE_GOOGLE_CLIENT_ID:$d,EXPERIENCE_GOOGLE_CLIENT_SECRET:$e,EXPERIENCE_GOOGLE_TOKEN_KEY:$f} + $flags')"
          if ! jq -e --argjson expected "$expected_env" --argjson secrets "$expected_secrets" '
            (.spec.containers[0].env | map(select(has("value")) | {key:.name,value:.value}) | from_entries) == $expected and
            (.spec.containers[0].env | map(select(has("valueFrom")) | {key:.name,value:(.valueFrom.secretKeyRef.name + ":" + .valueFrom.secretKeyRef.key)}) | from_entries) == $secrets
          ' <<< "$revision" >/dev/null; then
            printf '::error::Revision %s environment variables or Secret references do not match the approved staging settings.\n' "$REVISION" >&2
            exit 1
          fi
          url="$(jq -r --arg revision "$REVISION" '[.status.traffic[] | select(.revisionName == $revision and .url != null) | .url][0] // empty' <<< "$state")"
          if [[ ! "$url" =~ ^https://[a-z0-9-]+\.a\.run\.app$ ]]; then
            printf '::error::Revision %s has no valid tagged Cloud Run URL (url=%s).\n' "$REVISION" "$url" >&2
            exit 1
          fi
          if [ "$ACTION" = candidate ]; then
            gcloud run services update-traffic "$SERVICE" --project "$PROJECT" --region "$REGION" --update-tags "candidate=$REVISION" --quiet
            state="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json)"
          fi
          immutable_tag="$(jq -r --arg revision "$REVISION" '[.status.traffic[] | select(.revisionName == $revision and ((.tag // "") | test("^(cand-|candidate-).+"))) | .tag][0] // empty' <<< "$state")"
          url="$(EDGE_TARGET=stg EDGE_REVISION="$REVISION" EDGE_TAG="$immutable_tag" node scripts/deploy/edge-route.mjs <<< "$state")"
          {
            echo "revision=$REVISION"
            echo "digest=$DIGEST"
            echo "url=$url"
          } >> "$GITHUB_OUTPUT"
          sales="sales disabled"
          if [ "$GUEST_BOOKING" = true ]; then sales="Stripe test bookings open"; fi
          {
            echo "Reviewed SHA: $SHA"
            echo "Revision: $REVISION"
            echo "Runtime image digest: $DIGEST"
            if [ "$ACTION" = candidate ]; then echo "Pushed image digest: $PUSHED_DIGEST"; fi
            echo "Candidate created with ${sales} and indexing blocked."
            echo "Feature flags: ${FLAG_SUMMARY}"
          } >> "$GITHUB_STEP_SUMMARY"
      # The mTLS edge and restricted origin protect this public read-only candidate route.
      - name: Smoke candidate without logging login responses
        env:
          URL: ${{ steps.candidate.outputs.url }}
        run: |
          for path in / /host; do
            curl -fsS --retry 4 --retry-all-errors --max-time 30 -o /dev/null "${URL}${path}"
          done
          robots="$(curl -fsS --max-time 30 "${URL}/robots.txt")"
          grep -qF 'Disallow: /' <<< "$robots"
          host_page="$(curl -fsS --max-time 30 "${URL}/host")"
          grep -qF 'href="/host/auth/login"' <<< "$host_page"
          # Authentication/Google acceptance uses the stable origin only, after promotion.
      - name: Promote exact revision and verify stable origin with rollback
        if: inputs.action == 'promote'
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
        run: |
          state="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json)"
          previous="$(jq -r '[.status.traffic[] | select((.percent // 0) > 0) | {revisionName,percent}] | sort_by(.revisionName) | map("\(.revisionName)=\(.percent)") | join(",")' <<< "$state")"
          was_public="$(jq -r '.metadata.annotations["run.googleapis.com/invoker-iam-disabled"] // "false"' <<< "$state")"
          tags="$(jq -r --arg revision "$REVISION" --arg short "$CANDIDATE_TAG_PREFIX" --arg legacy "$LEGACY_CANDIDATE_TAG_PREFIX" '
            def is_candidate_tag($short; $legacy): . as $tag | ($tag | startswith($short)) or ($tag | startswith($legacy));
            [.status.traffic[] | select(.revisionName == $revision and ((.tag // "") | is_candidate_tag($short; $legacy))) | .tag] | join(",")
          ' <<< "$state")"
          test -n "$tags"
          rollback() {
            code=$?
            trap - EXIT
            if [ "$code" -ne 0 ]; then
              rollback_failed=false
              if [ "$was_public" != true ]; then
                gcloud run services update "$SERVICE" --project "$PROJECT" --region "$REGION" --invoker-iam-check --quiet || rollback_failed=true
              fi
              gcloud run services update-traffic "$SERVICE" --project "$PROJECT" --region "$REGION" --to-revisions "$previous" --quiet || rollback_failed=true
              gcloud run services update-traffic "$SERVICE" --project "$PROJECT" --region "$REGION" --remove-tags "$tags" --quiet || rollback_failed=true
              restored="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json)" || rollback_failed=true
              actual="$(jq -r '[.status.traffic[] | select((.percent // 0) > 0) | {revisionName,percent}] | sort_by(.revisionName) | map("\(.revisionName)=\(.percent)") | join(",")' <<< "$restored")" || rollback_failed=true
              if [ "$actual" != "$previous" ]; then rollback_failed=true; fi
              if [ "$rollback_failed" = true ]; then echo 'Rollback requires manual recovery.' >&2; fi
              echo 'Promotion verification failed; rollback and candidate tag removal requested. Read back service traffic before retrying.' >&2
            fi
            exit "$code"
          }
          trap rollback EXIT
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT" --region "$REGION" --to-revisions "${REVISION}=100" --quiet
          # The initial placeholder stays private until the accepted app serves 100%.
          gcloud run services update "$SERVICE" --project "$PROJECT" --region "$REGION" --no-invoker-iam-check --quiet
          state="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json)"
          jq -e --arg revision "$REVISION" '[.status.traffic[] | select((.percent // 0) > 0)] | length == 1 and .[0].revisionName == $revision and .[0].percent == 100' <<< "$state" >/dev/null
          robots="$(curl -fsS --retry 4 --retry-all-errors --max-time 30 "$SITE_URL/robots.txt")"
          grep -qF 'Disallow: /' <<< "$robots"
          host_page="$(curl -fsS --max-time 30 "$SITE_URL/host")"
          grep -qF 'href="/host/auth/login"' <<< "$host_page"
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT" --region "$REGION" --remove-tags "$tags" --quiet
          bookings="bookings=false"
          if [ "$GUEST_BOOKING" = true ]; then bookings="bookings=true (Stripe test mode)"; fi
          echo "Stable staging origin: $SITE_URL; ${bookings}; indexing=block. OAuth acceptance remains manual." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove this failed candidate tag
        if: failure() && inputs.action == 'candidate' && steps.deploy_auth.outcome == 'success'
        env:
          CANDIDATE_TAG: ${{ steps.candidate_tag.outputs.tag }}
        run: |
          legacy_tag="${LEGACY_CANDIDATE_TAG_PREFIX}${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          state="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json)"
          tags="$(jq -r --arg tag "$CANDIDATE_TAG" --arg legacy_tag "$legacy_tag" --arg short "$CANDIDATE_TAG_PREFIX" --arg legacy "$LEGACY_CANDIDATE_TAG_PREFIX" '
            def is_candidate_tag($short; $legacy): . as $tag | ($tag | startswith($short)) or ($tag | startswith($legacy));
            [.status.traffic[] | select((.tag == $tag or .tag == $legacy_tag) and ((.tag // "") | is_candidate_tag($short; $legacy))) | .tag] | join(",")
          ' <<< "$state")"
          if [ -n "$tags" ]; then
            gcloud run services update-traffic "$SERVICE" --project "$PROJECT" --region "$REGION" --remove-tags "$tags" --quiet
          fi
      - name: Remove selected tags after failed promotion checks
        if: failure() && inputs.action == 'promote' && steps.deploy_auth.outcome == 'success'
        run: |
          state="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json)"
          tags="$(jq -r --arg revision "$REVISION" --arg short "$CANDIDATE_TAG_PREFIX" --arg legacy "$LEGACY_CANDIDATE_TAG_PREFIX" '
            def is_candidate_tag($short; $legacy): . as $tag | ($tag | startswith($short)) or ($tag | startswith($legacy));
            [.status.traffic[] | select(.revisionName == $revision and ((.tag // "") | is_candidate_tag($short; $legacy))) | .tag] | join(",")
          ' <<< "$state")"
          if [ -n "$tags" ]; then
            gcloud run services update-traffic "$SERVICE" --project "$PROJECT" --region "$REGION" --remove-tags "$tags" --quiet
          fi
