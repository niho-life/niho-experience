# Public CI: synthetic data only, no secrets, GitHub-hosted runners.
# Fork PRs run with a read-only token. Images are built and tested but never pushed or deployed here
# (see docs/adr/0001-web-stack.md).
#
# `premerge-gate` is the one check the `main` ruleset requires (docs/development.md「PR とマージ」).
# Pull requests have no path filter on purpose: a workflow skipped by `paths` leaves a required check
# pending forever, while a job skipped by `if` reports success. So `changes` decides what a PR needs,
# the jobs skip themselves, and the gate accepts a skip only where `changes` allowed it.
name: CI

on:
  pull_request:
  # Not used yet: lets a merge queue run this workflow if `main` ever requires one.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  EXPERIENCE_API_MODE: mock
  SITE_INDEXING: block

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.files.outputs.docs_only }}
      api_client: ${{ steps.files.outputs.api_client }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          # The PR's merge commit and its first parent (the base it merges into).
          fetch-depth: 2
          persist-credentials: false
      - id: files
        run: |
          set -euo pipefail
          # Pushes to main and merge queue entries always run everything.
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "api_client=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          echo "Changed files:"; cat "$RUNNER_TEMP/changed"
          # Same set the old `paths-ignore` skipped. An empty diff runs everything.
          if [ -s "$RUNNER_TEMP/changed" ] && ! grep -Ev '(^docs/|\.md$)' "$RUNNER_TEMP/changed" > /dev/null; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(packages/api-client/|package-lock\.json$|\.github/workflows/ci\.yml$)' "$RUNNER_TEMP/changed"; then
            echo "api_client=true" >> "$GITHUB_OUTPUT"
          else
            echo "api_client=false" >> "$GITHUB_OUTPUT"
          fi

  stg-document-readback:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test stg document readback with a local synthetic server
        run: python3 scripts/test_stg_document_readback.py
      - name: Test synthetic staging booking gates without network access
        run: python3 scripts/test_stg_booking_preflight.py
      - name: Test production owner and rerun authorization without credentials
        run: python3 scripts/test_production_owner.py

  # The old single `web` job ran everything in sequence (22-28 minutes). These jobs are independent, so they run side by
  # side; each does its own checkout and `npm ci` (the shared npm cache keeps that to about a minute). A run is about as
  # slow as the slowest of them. GitHub's Free plan runs 20 jobs at once across the repository, so do not split further
  # without a reason: more jobs per run only queue when several pull requests run together.
  # Playwright 1.56.1 cannot install Chromium dependencies on ubuntu-26.04 (the current ubuntu-latest image), so every
  # job that was part of `web` stays on ubuntu-24.04.

  static:
    # Presentation package checks, lint and typecheck: no database, no browser.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: npm run check:presentation
      - run: npm run lint
      - run: npm run typecheck

  store-tests:
    # The slowest tests: every integration case applies all migrations to its own PostgreSQL schema.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TEST_DATABASE_URL: postgresql://experience_test:synthetic_test_only@localhost:5432/experience_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: experience_test
          POSTGRES_PASSWORD: synthetic_test_only
          POSTGRES_DB: experience_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U experience_test -d experience_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: npm -w @niho-experience/experience-store run test

  unit-tests:
    # The tests of every other workspace, including the web app's vitest (its integration project needs PostgreSQL).
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgresql://experience_test:synthetic_test_only@localhost:5432/experience_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: experience_test
          POSTGRES_PASSWORD: synthetic_test_only
          POSTGRES_DB: experience_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U experience_test -d experience_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Test every workspace except experience-store (store-tests runs that one)
        run: |
          set -euo pipefail
          # Listed from the repository, so a workspace added later is tested here without editing this file.
          names=()
          while IFS= read -r name; do names+=("$name"); done < <(npm query .workspace | jq -r '.[].name | select(. != "@niho-experience/experience-store")')
          test "${#names[@]}" -gt 0
          echo "Testing: ${names[*]}"
          args=()
          for name in "${names[@]}"; do args+=("--workspace=$name"); done
          npm run test --if-present "${args[@]}"

  e2e:
    # The default Playwright matrix (mobile and desktop, five servers), split in two. Each half builds the site itself.
    name: e2e (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: npm run build
      - name: Install Chromium for Playwright
        run: npx -w @niho-experience/web playwright install --with-deps chromium
      - name: Run this half of the Playwright matrix
        run: npm -w @niho-experience/web run test:e2e -- --shard=${{ matrix.shard }}/2
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-e2e-${{ matrix.shard }}
          path: apps/web/playwright-report
          retention-days: 7

  e2e-provider-operations:
    # One worker and a dev server, so it takes minutes on its own; it needs no production build.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Install Chromium for Playwright
        run: npx -w @niho-experience/web playwright install --with-deps chromium
      - name: Test provider owner and cohost operations with synthetic data
        run: npm -w @niho-experience/web run test:e2e:provider-operations
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-provider-operations
          path: apps/web/playwright-report
          retention-days: 7

  e2e-misc:
    # The remaining browser suites, in the order they had in `web`.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: npm run build
      - name: Install Chromium for Playwright
        run: npx -w @niho-experience/web playwright install --with-deps chromium
      - name: Test OTA browser adapter with synthetic data
        run: npm -w @niho-experience/ota-worker run test:browser
      - name: Test assisted registration and representative consent with synthetic data
        run: npm -w @niho-experience/web run test:e2e:assisted-launch
      - name: Test host calendar with synthetic data
        run: npm -w @niho-experience/web run test:e2e:host-calendar
      - name: Test editor.niho.life as the guide source with synthetic data
        run: npm -w @niho-experience/web run test:e2e:guide-editor
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-misc
          path: apps/web/playwright-report
          retention-days: 7

  container:
    # Builds the image that would be deployed (not pushed anywhere) and smoke-tests it.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t niho-experience:ci .
      - name: Smoke test
        run: sh scripts/container-smoke.sh niho-experience:ci

  api-client:
    # The contract checks (generated types) only when the client or the lockfile changes.
    needs: changes
    if: needs.changes.outputs.api_client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # One lockfile for the whole repo (npm workspaces).
      - run: npm ci
      - run: npm -w @niho-experience/api-client run check

  premerge-gate:
    # `always()`: without it a failed job would skip this one, and a skipped required check passes.
    if: always()
    needs:
      - changes
      - stg-document-readback
      - static
      - store-tests
      - unit-tests
      - e2e
      - e2e-provider-operations
      - e2e-misc
      - container
      - api-client
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed, skipped only where `changes` allowed it
        env:
          RESULTS: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          API_CLIENT: ${{ needs.changes.outputs.api_client }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key)\t\(.value.result)"'
          echo "$RESULTS" | jq -e --arg docs "$DOCS_ONLY" --arg api "$API_CLIENT" '
            to_entries | all(
              .value.result == "success"
              or (.value.result == "skipped" and .key != "changes"
                  and ($docs == "true" or (.key == "api-client" and $api != "true")))
            )' > /dev/null
